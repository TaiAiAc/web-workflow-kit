<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' ws:"
    />
    <title>前端交付流水线</title>
  </head>
  <body>
    <main class="boot">
      <svg width="72" height="72" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
        <defs>
          <linearGradient id="bootbg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#3b7bff" />
            <stop offset="1" stop-color="#7046d6" />
          </linearGradient>
          <linearGradient id="bootshine" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffffff" stop-opacity=".18" />
            <stop offset=".5" stop-color="#ffffff" stop-opacity="0" />
          </linearGradient>
        </defs>
        <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#bootbg)" />
        <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#bootshine)" />
        <polyline
          points="232,540 420,724 796,332"
          fill="none"
          stroke="#ffffff"
          stroke-width="84"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <circle cx="232" cy="540" r="76" fill="#ffffff" />
        <circle cx="232" cy="540" r="34" fill="#3b7bff" />
        <circle cx="420" cy="724" r="76" fill="#ffffff" />
        <circle cx="420" cy="724" r="34" fill="#5a5fe8" />
        <circle cx="796" cy="332" r="76" fill="#ffffff" />
        <circle cx="796" cy="332" r="34" fill="#7046d6" />
      </svg>
      <h1>前端交付流水线</h1>
      <p class="sub">本地前端交付控制台</p>

      <section id="starting" class="panel">
        <div class="spinner" aria-hidden="true"></div>
        <p id="starting-text">正在启动…</p>
      </section>

      <section id="error" class="panel" hidden>
        <h2 id="error-title"></h2>

        <pre id="log" class="log" hidden></pre>

        <div class="actions">
          <button id="retry" type="button" class="primary">重试</button>
          <button id="copy-log" type="button">复制日志</button>
        </div>
      </section>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
