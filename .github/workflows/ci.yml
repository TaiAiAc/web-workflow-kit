name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: verify.ts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: verify
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: verify/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: bundled verify.mjs is up to date
        run: |
          pnpm build
          git diff --exit-code -- ../web_workflow_kit/assets/verify.mjs || (echo "::error::verify.mjs is stale - run 'pnpm build' in verify/ and commit" && exit 1)
        shell: bash

  pipeline:
    name: pipeline (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python -m pip install -e ".[checkpoint,acp]"
      - run: python -m unittest discover tests -v

  package:
    name: wheel works outside the repo (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python -m pip wheel --no-deps . -w dist
      - name: install into a clean venv and use it from an unrelated directory
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          if [ "$RUNNER_OS" = "Windows" ]; then BIN="$RUNNER_TEMP/venv/Scripts"; else BIN="$RUNNER_TEMP/venv/bin"; fi
          "$BIN/python" -m pip install dist/*.whl
          mkdir -p "$RUNNER_TEMP/app" && cd "$RUNNER_TEMP/app" && git init -q
          "$BIN/agent" --version
          "$BIN/agent" --init
          test -f rules.yaml && test -f agent.config.json
          printf 'project_type: web\nprofiles:\n  web:\n    checks: [typecheck]\n    typecheck:\n      run: "node -e \\"console.log(1)\\""\n' > rules.yaml
          "$BIN/agent" --verify
