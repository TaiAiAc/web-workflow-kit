name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: verify.ts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: verify
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: verify/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: bundled verify.mjs is up to date
        run: |
          pnpm build
          git diff --exit-code -- ../assets/verify.mjs || (echo "::error::verify.mjs is stale - run 'pnpm build' in verify/ and commit" && exit 1)
        shell: bash

  core:
    name: TS core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: core/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: single-file bundle (what the desktop app ships)
        shell: bash
        run: |
          pnpm build
          node dist/wwk.mjs --help
      - name: gate and fix-loop scenarios on the TS core (.fx-stage)
        shell: bash
        working-directory: .
        run: |
          node .fx-stage/run-all.mjs --verbose

  package:
    name: npm package works outside the repo (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: core/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: core
      - name: pack, install into a clean prefix and use it from an unrelated directory
        shell: bash
        run: |
          cd core && npm pack --pack-destination "$RUNNER_TEMP" && cd ..
          npm install -g --prefix "$RUNNER_TEMP/prefix" "$RUNNER_TEMP"/web-workflow-kit-*.tgz
          if [ "$RUNNER_OS" = "Windows" ]; then WWK="$RUNNER_TEMP/prefix/wwk.cmd"; else WWK="$RUNNER_TEMP/prefix/bin/wwk"; fi
          mkdir -p "$RUNNER_TEMP/app" && cd "$RUNNER_TEMP/app" && git init -q
          "$WWK" --version
          "$WWK" init
          test -f rules.yaml && test -f agent.config.json
          printf 'project_type: web\nprofiles:\n  web:\n    checks: [typecheck]\n    typecheck:\n      run: "node -e \\"console.log(1)\\""\n' > rules.yaml
          "$WWK" verify
