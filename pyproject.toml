[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "web-workflow-kit"
version = "0.1.0"
description = "本地前端交付流水线：需求 → Spec → 代码 → 门禁 → 验收 → 回环 → 交付"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2",
    "python-dotenv",
    "pyyaml",
]

[project.optional-dependencies]
# 主流程不依赖它们，按需安装；all = 全部可选能力
mcp = ["langchain-mcp-adapters"]          # MasterGo 设计稿（design.enabled）
acp = ["langgraph-acp>=1.10"]             # code.backend = "acp"
checkpoint = ["langgraph-checkpoint-sqlite"]  # :resume 断点恢复
repl = ["prompt-toolkit"]
all = ["web-workflow-kit[mcp,acp,checkpoint,repl]"]

[project.scripts]
agent = "scripts.agent_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]
