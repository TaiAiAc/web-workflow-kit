<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>前端交付流水线</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"%3E%3Cdefs%3E%3ClinearGradient id="bg" x1="0" y1="0" x2="1" y2="1"%3E%3Cstop offset="0" stop-color="#3b7bff"/%3E%3Cstop offset="1" stop-color="#7046d6"/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x="2" y="2" width="60" height="60" rx="15" fill="url(#bg)"/%3E%3Cpolyline points="15,34 27,46 50,21" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/%3E%3Ccircle cx="15" cy="34" r="6" fill="#ffffff"/%3E%3Ccircle cx="27" cy="46" r="6" fill="#ffffff"/%3E%3Ccircle cx="50" cy="21" r="6" fill="#ffffff"/%3E%3C/svg%3E">
<style>
:root {
  --bg: #f5f6f8; --side: #eceef2; --panel: #ffffff; --panel-2: #f3f4f7; --hover: rgba(20, 30, 50, .06); --sel: rgba(47, 111, 237, .12);
  --line: #e1e4ea; --line-2: #cdd2da; --text: #1c2330; --muted: #5d6676; --faint: #8a93a3;
  --accent: #2f6fed; --accent-soft: #e8efff; --on-accent: #fff;
  --ok: #1a8a4f; --ok-soft: #e4f5ec; --bad: #cc3340; --bad-soft: #fdebed; --warn: #b76e00; --warn-soft: #fff3df;
  --purple: #7046d6; --teal: #0d7f86; --pink: #c0306b; --slate: #5d6676;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  --r: 7px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15181e; --side: #1b1f27; --panel: #1d222b; --panel-2: #232934; --hover: rgba(255, 255, 255, .06); --sel: rgba(109, 155, 255, .18);
    --line: #2a303c; --line-2: #3a4252; --text: #e6e9ef; --muted: #a0a9b8; --faint: #747e8f;
    --accent: #6d9bff; --accent-soft: #1d2a45; --on-accent: #0b1220;
    --ok: #4cc38a; --ok-soft: #14291f; --bad: #ff6b76; --bad-soft: #33181c; --warn: #f0a947; --warn-soft: #2e2311; --purple: #b49bff; --teal: #4fcfd6; --pink: #f285b0; --slate: #a0a9b8;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15181e; --side: #1b1f27; --panel: #1d222b; --panel-2: #232934; --hover: rgba(255, 255, 255, .06); --sel: rgba(109, 155, 255, .18);
  --line: #2a303c; --line-2: #3a4252; --text: #e6e9ef; --muted: #a0a9b8; --faint: #747e8f;
  --accent: #6d9bff; --accent-soft: #1d2a45; --on-accent: #0b1220;
  --ok: #4cc38a; --ok-soft: #14291f; --bad: #ff6b76; --bad-soft: #33181c; --warn: #f0a947; --warn-soft: #2e2311; --purple: #b49bff; --teal: #4fcfd6; --pink: #f285b0; --slate: #a0a9b8;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 13px/1.5 var(--sans); overflow: hidden; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; }
.hidden { display: none !important; }
svg.i { width: 15px; height: 15px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- 外框 ---------- */
.app { display: grid; grid-template-columns: 248px minmax(0, 1fr); height: 100vh; }
.side { background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.brand { display: flex; align-items: center; gap: 9px; padding: 14px 16px 4px; font-weight: 700; font-size: 13.5px; letter-spacing: .01em; }
.brand svg { flex: none; filter: drop-shadow(0 1px 2px rgba(0, 0, 0, .15)); }
.side-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px 8px 16px; }
.side-head h1 { font-size: 12px; font-weight: 600; color: var(--muted); margin: 0; letter-spacing: .02em; }
.ws-list { list-style: none; margin: 0; padding: 0 8px; overflow-y: auto; flex: 1; }
.ws { position: relative; display: flex; gap: 9px; align-items: flex-start; padding: 8px 8px 8px 10px; border-radius: var(--r); cursor: pointer; }
.ws:hover { background: var(--hover); }
.ws[aria-current="true"] { background: var(--sel); }
.ws .dot { margin-top: 6px; }
.ws .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ws .sub { color: var(--faint); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ws .grow { min-width: 0; flex: 1; }
.ws .more { visibility: hidden; }
.ws:hover .more, .ws[aria-current="true"] .more { visibility: visible; }
.side-foot { border-top: 1px solid var(--line); padding: 8px; display: flex; flex-direction: column; gap: 2px; }
.side-foot .row { display: flex; align-items: center; gap: 8px; padding: 6px 8px; color: var(--muted); border-radius: var(--r); background: none; border: 0; text-align: left; width: 100%; }
.side-foot button.row:hover { background: var(--hover); color: var(--text); }
.side-foot button.row[aria-current="true"] { background: var(--sel); color: var(--text); }

.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line-2); flex: none; }
.dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); } .dot.warn { background: var(--warn); }
.dot.running { background: var(--accent); animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }

.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }

/* ---------- 按钮 ---------- */
.btn { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: var(--r); border: 1px solid var(--line-2); background: var(--panel); white-space: nowrap; }
.btn:hover { background: var(--panel-2); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { border-color: transparent; background: none; color: var(--muted); }
.btn.ghost:hover { background: var(--hover); color: var(--text); }
.btn.icon { width: 28px; padding: 0; justify-content: center; }
.btn.warn { border-color: var(--warn); color: var(--warn); }
kbd { font: 11px var(--mono); color: inherit; opacity: .75; }

/* ---------- 工具栏 ---------- */
.toolbar { display: flex; align-items: center; gap: 10px; padding: 12px 18px; border-bottom: 1px solid var(--line); background: var(--panel); min-height: 58px; }
.toolbar .title { min-width: 0; flex: 1; }
.toolbar h2 { font-size: 15px; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.toolbar .meta { display: flex; gap: 8px; align-items: center; color: var(--faint); font-size: 12px; min-width: 0; }
.toolbar .path { font-family: var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tag { display: inline-flex; align-items: center; gap: 4px; padding: 0 7px; height: 20px; border-radius: 10px; background: var(--panel-2); color: var(--muted); font-size: 11.5px; white-space: nowrap; }
.tag.ok { background: var(--ok-soft); color: var(--ok); } .tag.bad { background: var(--bad-soft); color: var(--bad); }
.tag.warn { background: var(--warn-soft); color: var(--warn); } .tag.accent { background: var(--accent-soft); color: var(--accent); }
.tools { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }

.banner { display: flex; align-items: center; gap: 10px; margin: 12px 18px 0; padding: 8px 12px; border-radius: var(--r); background: var(--warn-soft); color: var(--warn); }
.banner .grow { flex: 1; }

/* ---------- 需求区 ---------- */
.compose { margin: 14px 18px 0; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
.compose textarea { display: block; width: 100%; min-height: 64px; max-height: 180px; resize: vertical; border: 0; background: none; color: var(--text); font: 14px/1.6 var(--sans); padding: 12px 14px 6px; outline: none; }
.recent { display: flex; gap: 6px; padding: 0 14px 8px; flex-wrap: wrap; }
.recent button { border: 1px dashed var(--line-2); background: none; color: var(--muted); border-radius: 12px; padding: 1px 9px; font-size: 12px; max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.recent button:hover { color: var(--text); border-color: var(--muted); }
.choices { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--line); }
.choice { display: flex; align-items: center; gap: 8px; }
/* 编程 / 修复 / 审阅：主界面只用三个彩色标签显示当前选择，点开弹窗再选 */
.role-tag { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 13px; border: 1px solid transparent; font-size: 12px; cursor: pointer; white-space: nowrap; }
.role-tag .k { opacity: .75; }
.role-tag b { font-weight: 600; }
.role-tag b small { font-size: 10.5px; font-weight: 500; opacity: .82; }
.role-tag:hover { border-color: currentColor; }
.role-tag { --role: var(--accent); background: color-mix(in srgb, var(--role) 13%, transparent); color: var(--role); }
.role-tag.product { --role: var(--purple); }
.role-tag.tech { --role: var(--teal); }
.role-tag.code { --role: var(--accent); }
.role-tag.fix { --role: var(--warn); }
.role-tag.review { --role: var(--ok); }
.role-tag.vision { --role: var(--pink); }
.role-tag.arbiter { --role: var(--slate); }
.role-tag.na b { text-decoration: line-through; }
/* 预览：把交付的代码跑起来 */
.pvcard { margin-top: 12px; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); display: flex; flex-direction: column; gap: 8px; }
.pvcard .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.pvcard .grow { flex: 1; min-width: 160px; color: var(--muted); font-size: 12.5px; }
.pvcard .cmd { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.pvcard a.url { font-family: var(--mono); font-size: 12.5px; color: var(--accent); }
.pvcard pre { margin: 0; max-height: 180px; overflow: auto; white-space: pre-wrap; word-break: break-word; font: 11.5px var(--mono); color: var(--muted); background: var(--panel-2); border-radius: 6px; padding: 6px 8px; }
.pvcard .err { color: var(--bad); font-size: 12.5px; white-space: pre-wrap; }
dialog.merge.picker-dlg { width: min(720px, calc(100vw - 32px)); }
.picker { display: flex; flex-direction: column; gap: 14px; }
.picker .choice { flex-direction: column; align-items: flex-start; gap: 6px; }
.picker .choice > span { font-weight: 600; font-size: 12px; color: var(--muted); }
.picker .seg { flex-wrap: wrap; }
.picker .why { color: var(--faint); font-size: 11.5px; }
.agent-options { display: grid; gap: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
.agent-option { display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 8px; align-items: center; }
.agent-option > span { color: var(--muted); font-size: 12px; font-weight: 600; }
.agent-option select { width: 100%; min-height: 34px; padding: 0 34px 0 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--text); font: inherit; }
.agent-option select:disabled { opacity: .55; cursor: not-allowed; }
.agent-option .why { grid-column: 2; margin-top: -4px; }
.agent-options .loading-line { color: var(--faint); font-size: 12px; }
.picker .choice.busy .seg button { pointer-events: none; }
.picker .choice.loading .seg { opacity: .6; }
.picker .choice.loading > span::after { content: ""; display: inline-block; width: 10px; height: 10px; margin-left: 6px; vertical-align: -1px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: rot .8s linear infinite; }
.picker .why span[title] { text-decoration: underline dotted; text-underline-offset: 2px; cursor: help; }
.choice > span { color: var(--faint); font-size: 12px; }
.seg { display: inline-flex; background: var(--panel-2); border-radius: var(--r); padding: 2px; gap: 2px; }
.seg button { border: 0; background: none; color: var(--muted); padding: 3px 9px; border-radius: 5px; font-size: 12px; white-space: nowrap; }
.seg button:hover { color: var(--text); }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--text); font-weight: 600; box-shadow: 0 0 0 1px var(--line-2); }
.seg button.na { text-decoration: line-through; text-decoration-color: var(--faint); opacity: .6; }
.compose-foot { display: flex; align-items: center; gap: 8px; padding: 8px 10px 10px 14px; }
.compose-foot .grow { flex: 1; color: var(--bad); font-size: 12px; }
.design-chip { display: inline-flex; align-items: center; gap: 6px; max-width: 260px; }
.design-chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- 运行区 ---------- */
.work { flex: 1; min-height: 0; display: grid; grid-template-columns: 236px minmax(0, 1fr); margin: 14px 18px 18px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.runs { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.runs h3, .pane-title { font-size: 12px; color: var(--faint); font-weight: 600; margin: 0; padding: 10px 12px 6px; }
.runs ul { list-style: none; margin: 0; padding: 0 6px 6px; overflow-y: auto; flex: 1; }
.run-item { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 7px 8px; border-radius: var(--r); }
.run-item:hover { background: var(--hover); }
.run-item[aria-current="true"] { background: var(--sel); }
.run-item .l1 { display: flex; align-items: center; gap: 7px; }
.run-item .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
.run-item .l2 { color: var(--faint); font-size: 11.5px; margin-left: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.runs .empty { color: var(--faint); padding: 10px 12px; }

.detail { display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow-y: auto; }
.detail > * { flex-shrink: 0; }   /* 整栏滚动，子块不被压扁 */
.detail-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px 4px; flex-wrap: wrap; }
.detail-head h3 { margin: 0; font-size: 14px; min-width: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.detail-sub { color: var(--faint); font-size: 12px; padding: 0 16px; }

/* 流程进度条 */
.flow { display: flex; align-items: stretch; gap: 0; padding: 14px 16px 6px; overflow-x: auto; }
.step { flex: none; min-width: 104px; max-width: 168px; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 7px 10px; cursor: pointer; }
.step:hover { border-color: var(--line-2); }
.step .n { display: flex; align-items: center; gap: 6px; font-weight: 600; white-space: nowrap; }
.step .s { color: var(--faint); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.step.done { border-color: color-mix(in srgb, var(--ok) 45%, var(--line)); background: var(--ok-soft); }
.step.done .n { color: var(--ok); }
.step.fail { border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); background: var(--bad-soft); }
.step.fail .n { color: var(--bad); }
.step.running { border-color: var(--accent); background: var(--accent-soft); }
.step.running .n { color: var(--accent); }
.step.warn { border-color: color-mix(in srgb, var(--warn) 45%, var(--line)); background: var(--warn-soft); }
.step.warn .n { color: var(--warn); }
.step.ghost { border-style: dashed; background: none; color: var(--faint); cursor: default; }
.step.ghost .n { color: var(--faint); font-weight: 500; }
.step.sel { box-shadow: 0 0 0 2px var(--accent); }
.arrow { flex: none; display: flex; align-items: center; color: var(--line-2); padding: 0 4px; }
.arrow.loop { color: var(--warn); }
.spin { width: 12px; height: 12px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: rot .8s linear infinite; flex: none; }
@keyframes rot { to { transform: rotate(360deg); } }

.checks { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding: 4px 16px 10px; font-size: 12px; }
.checks .lbl { color: var(--faint); }
.chk { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 10px; background: var(--panel-2); color: var(--muted); font-family: var(--mono); font-size: 11.5px; }
.chk.pass { background: var(--ok-soft); color: var(--ok); } .chk.fail { background: var(--bad-soft); color: var(--bad); }
.chk.skip { color: var(--faint); }
.checks .rounds { margin-left: auto; color: var(--faint); }

.result { margin: 4px 16px 10px; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2); }
.result.ok { background: var(--ok-soft); border-color: color-mix(in srgb, var(--ok) 35%, var(--line)); }
.result.bad { background: var(--bad-soft); border-color: color-mix(in srgb, var(--bad) 35%, var(--line)); }
.result .sum { font-weight: 600; }
.result details { margin-top: 6px; color: var(--muted); }
.result summary { cursor: pointer; }
.result ul { margin: 6px 0 0; padding-left: 18px; font-family: var(--mono); font-size: 12px; max-height: 180px; overflow-y: auto; }
.fails { margin: 0 16px 10px; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.fails table { width: 100%; border-collapse: collapse; font-size: 12px; }
.fails th, .fails td { text-align: left; padding: 6px 10px; border-top: 1px solid var(--line); vertical-align: top; }
.fails th { background: var(--panel-2); color: var(--faint); font-weight: 600; border-top: 0; }
.fails td.code { font-family: var(--mono); color: var(--bad); white-space: nowrap; }
.fails td.loc { font-family: var(--mono); color: var(--muted); }

/* 日志 */
.log-bar { display: flex; align-items: center; gap: 4px; padding: 6px 16px; border-top: 1px solid var(--line); flex-wrap: wrap; position: sticky; top: 0; background: var(--panel); z-index: 1; }
.log-bar .tab { border: 0; background: none; color: var(--muted); padding: 3px 9px; border-radius: 12px; font-size: 12px; }
.log-bar .tab:hover { background: var(--hover); }
.log-bar .tab[aria-pressed="true"] { background: var(--panel-2); color: var(--text); font-weight: 600; }
.log-bar .grow { flex: 1; }
.log { padding: 4px 16px 16px; font: 12px/1.65 var(--mono); }
.grp { border-left: 2px solid var(--line); margin: 6px 0; }
.grp.ok { border-left-color: var(--ok); } .grp.bad { border-left-color: var(--bad); } .grp.warn { border-left-color: var(--warn); } .grp.running { border-left-color: var(--accent); }
.grp > summary { list-style: none; cursor: pointer; padding: 3px 10px; font-family: var(--sans); font-size: 12.5px; display: flex; gap: 8px; align-items: center; }
.grp > summary::-webkit-details-marker { display: none; }
.grp > summary .chev { transition: transform .15s; color: var(--faint); }
.grp[open] > summary .chev { transform: rotate(90deg); }
.grp > summary b { font-weight: 600; }
.grp > summary .m { color: var(--faint); }
.grp pre { margin: 0; padding: 2px 10px 6px 26px; white-space: pre-wrap; word-break: break-word; color: var(--muted); }
.grp pre .t { color: var(--faint); user-select: none; }
.grp pre .x { color: var(--bad); } .grp pre .v { color: var(--ok); } .grp pre .h { color: var(--text); }
.grp .none { padding: 2px 10px 6px 26px; color: var(--faint); font-family: var(--sans); }

/* 空状态 / 弹层 / 提示 */
.blank { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px; }
.blank .card { max-width: 420px; text-align: center; }
.blank h2 { font-size: 18px; margin: 0 0 6px; }
.blank p { color: var(--muted); margin: 0 0 16px; }
.detail .blank { min-height: 220px; }
.pop { position: fixed; z-index: 20; background: var(--panel); border: 1px solid var(--line-2); border-radius: 9px; box-shadow: 0 10px 30px rgba(0, 0, 0, .18); padding: 6px; min-width: 200px; }
.pop button { display: flex; width: 100%; align-items: center; gap: 8px; border: 0; background: none; padding: 7px 10px; border-radius: 6px; text-align: left; }
.pop button:hover { background: var(--hover); }
.pop button.danger { color: var(--bad); }
.pop .sep { height: 1px; background: var(--line); margin: 4px 2px; }
.pop .agent-row { display: flex; gap: 8px; align-items: flex-start; padding: 6px 10px; }
.pop .agent-row .d { color: var(--faint); font-size: 12px; }
/* 设置页 */
.settings { flex: 1; overflow-y: auto; padding: 18px 22px 40px; }
.settings h2 { font-size: 16px; margin: 0; }
.set-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
.set-head .grow { flex: 1; }
.set-note { color: var(--faint); font-size: 12px; margin: 0 0 14px; }
.set-sec { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; margin-top: 14px; }
.set-sec > header { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.set-sec > header h3 { margin: 0; font-size: 13.5px; flex: 1; }
.set-sec .body { padding: 12px 16px; }
.agent-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
.agent-card { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.agent-card .t { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.agent-card .v { color: var(--faint); font-size: 11.5px; font-weight: 400; margin-left: auto; }
.agent-card .d { color: var(--muted); font-size: 12px; }
.agent-card .n { color: var(--faint); font-size: 11.5px; }
.agent-card .acts { display: flex; gap: 6px; margin-top: 2px; }
.field { display: grid; grid-template-columns: 170px minmax(0, 1fr) auto; gap: 6px 12px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.field:first-child { border-top: 0; }
.field .lbl { font-weight: 600; }
.field .lbl small { display: block; font-weight: 400; color: var(--faint); font-size: 11.5px; }
.field input { height: 30px; border: 1px solid var(--line-2); border-radius: var(--r); background: var(--panel); color: var(--text); padding: 0 10px; font: 12.5px var(--mono); width: 100%; }
.field input:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
.field .acts { display: flex; gap: 6px; }
.field .hint { grid-column: 2 / 4; color: var(--faint); font-size: 11.5px; margin-top: -2px; }
.net-rows { margin-top: 10px; display: grid; gap: 4px; font-size: 12px; }
.net-rows div { display: flex; gap: 10px; align-items: center; }
.sec-foot { display: flex; gap: 8px; justify-content: flex-end; padding: 0 16px 12px; }
.toasts { position: fixed; right: 18px; bottom: 18px; display: flex; flex-direction: column; gap: 8px; z-index: 30; }
.toast { background: var(--text); color: var(--bg); padding: 9px 14px; border-radius: 8px; max-width: 420px; box-shadow: 0 6px 20px rgba(0, 0, 0, .2); }
.toast.bad { background: var(--bad); color: #fff; }
/* 作业分支：运行详情里的卡片、开工检查的问题、合并弹窗 */
.btn.danger { color: var(--bad); }
.flowcard { margin-top: 12px; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.flowcard .grow { flex: 1; min-width: 200px; }
.flowcard .b, .target .n { font-family: var(--mono); font-size: 12px; }
.flowcard .note { color: var(--muted); font-size: 12px; white-space: pre-wrap; }
.problems { display: flex; flex-direction: column; gap: 4px; color: var(--bad); }
.problems .p { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
dialog.merge { border: 1px solid var(--line-2); border-radius: 12px; background: var(--panel); color: var(--text); padding: 0; width: min(640px, calc(100vw - 32px)); box-shadow: 0 20px 60px rgba(0, 0, 0, .25); }
dialog.merge::backdrop { background: rgba(10, 14, 22, .45); }
dialog.merge header { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
dialog.merge header h3 { margin: 0; font-size: 14px; flex: 1; }
dialog.merge .body { padding: 12px 16px; display: flex; flex-direction: column; gap: 12px; max-height: 68vh; overflow-y: auto; }
dialog.merge .lbl { font-weight: 600; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
dialog.merge textarea { width: 100%; min-height: 72px; border: 1px solid var(--line-2); border-radius: var(--r); background: var(--panel); color: var(--text); padding: 8px 10px; font: 12.5px var(--mono); resize: vertical; }
dialog.merge footer { display: flex; gap: 8px; align-items: center; padding: 12px 16px; border-top: 1px solid var(--line); }
dialog.merge footer .grow { flex: 1; color: var(--faint); font-size: 12px; }
.targets { display: flex; flex-direction: column; gap: 4px; }
.target { display: block; width: 100%; text-align: left; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--r); background: none; }
.target:hover { background: var(--hover); }
.target[aria-checked="true"] { border-color: var(--accent); background: var(--accent-soft); }
.target .n { font-weight: 600; }
.target .m { color: var(--muted); font-size: 12px; }
.target .m .x { color: var(--bad); }
.rehearsal { padding: 8px 10px; border-radius: var(--r); background: var(--panel-2); font-size: 12.5px; }
.rehearsal.ok { background: var(--ok-soft); color: var(--ok); }
.rehearsal.bad { background: var(--bad-soft); color: var(--bad); white-space: pre-wrap; }
dialog.merge.wide { width: min(980px, calc(100vw - 32px)); }
.mtable { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.mtable th, .mtable td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.mtable th { color: var(--muted); font-weight: 600; white-space: nowrap; }
.mtable td.num { font-family: var(--mono); white-space: nowrap; }
.mtable .why { color: var(--muted); font-size: 12px; }
.rehearsal pre { margin: 6px 0 0; max-height: 160px; overflow: auto; white-space: pre-wrap; color: var(--muted); font: 11.5px var(--mono); }
</style>
</head>
<body>
<div class="app">
  <nav class="side" aria-label="工作空间">
    <div class="brand"><svg width="26" height="26" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024"><defs><linearGradient id="sbbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b7bff"/><stop offset="1" stop-color="#7046d6"/></linearGradient><linearGradient id="sbshine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".18"/><stop offset=".5" stop-color="#ffffff" stop-opacity="0"/></linearGradient></defs><rect x="32" y="32" width="960" height="960" rx="224" fill="url(#sbbg)"/><rect x="32" y="32" width="960" height="960" rx="224" fill="url(#sbshine)"/><polyline points="232,540 420,724 796,332" fill="none" stroke="#ffffff" stroke-width="84" stroke-linecap="round" stroke-linejoin="round"/><circle cx="232" cy="540" r="76" fill="#ffffff"/><circle cx="232" cy="540" r="34" fill="#3b7bff"/><circle cx="420" cy="724" r="76" fill="#ffffff"/><circle cx="420" cy="724" r="34" fill="#5a5fe8"/><circle cx="796" cy="332" r="76" fill="#ffffff"/><circle cx="796" cy="332" r="34" fill="#7046d6"/></svg><span>前端交付流水线</span></div>
    <div class="side-head">
      <h1>工作空间</h1>
      <button class="btn icon ghost" id="add-ws" type="button" title="添加项目" aria-label="添加项目"></button>
    </div>
    <ul class="ws-list" id="ws-list"></ul>
    <div class="side-foot">
      <button class="row" id="agents-btn" type="button"></button>
      <button class="row" id="theme-btn" type="button"></button>
      <div class="row"><span class="dot" id="conn-dot"></span><span id="conn-text">连接中…</span></div>
    </div>
  </nav>
  <main class="main" id="main"></main>
</div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<dialog class="merge" id="merge-dlg" aria-labelledby="merge-title"></dialog>
<dialog class="merge wide" id="metrics-dlg" aria-labelledby="metrics-title"></dialog>
<dialog class="merge picker-dlg" id="choice-dlg" aria-labelledby="choice-title"></dialog>

<script>
"use strict";
const TOKEN = "__WWK_TOKEN__";
const PIPELINE = "前端交付流水线", FIX_LOOP = "门禁修复回环", GATE_ONLY = "仅门禁";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const desktop = window.wwkDesktop || null;

async function api(path, opts = {}) {
  const res = await fetch(path, { ...opts, headers: { "X-WWK-Token": TOKEN, "Content-Type": "application/json", ...(opts.headers || {}) } });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const err = new Error(data.error || `请求失败（${res.status}）`);
    err.status = res.status;
    err.problems = data.problems || null;   // 开工检查没过时的问题清单
    throw err;
  }
  return data;
}
const post = (path, body) => api(path, { method: "POST", body: JSON.stringify(body) });

// ---------- 图标（页面不加载外部资源，内联 SVG） ----------
const ICONS = {
  plus: '<path d="M12 5v14M5 12h14"/>',
  play: '<path d="M7 5l12 7-12 7z"/>',
  shield: '<path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/><path d="M9 12l2 2 4-4"/>',
  loop: '<path d="M4 12a8 8 0 0 1 14-5.3L20 9"/><path d="M20 4v5h-5"/><path d="M20 12a8 8 0 0 1-14 5.3L4 15"/><path d="M4 20v-5h5"/>',
  folder: '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  more: '<circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/>',
  clip: '<path d="M21 11l-8.5 8.5a5 5 0 0 1-7-7L14 4a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3L15 7"/>',
  x: '<path d="M6 6l12 12M18 6L6 18"/>',
  chev: '<path d="M9 6l6 6-6 6"/>',
  arrow: '<path d="M5 12h14M13 6l6 6-6 6"/>',
  gear: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
  cpu: '<rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  wand: '<path d="M15 4V2M15 10V8M11 6h2M17 6h2M4 20L14 10"/>',
  trash: '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
};
const icon = (n, cls = "") => `<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]}</svg>`;

// ---------- 小工具 ----------
function toast(text, bad = false) {
  const el = document.createElement("div");
  el.className = "toast" + (bad ? " bad" : "");
  el.textContent = text;
  $("toasts").appendChild(el);
  setTimeout(() => el.remove(), bad ? 6000 : 3000);
}
function ago(sec) {
  if (!sec) return "";
  const d = Date.now() / 1000 - sec;
  if (d < 60) return "刚刚";
  if (d < 3600) return `${Math.floor(d / 60)} 分钟前`;
  if (d < 86400) return `${Math.floor(d / 3600)} 小时前`;
  if (d < 86400 * 2) return "昨天";
  return new Date(sec * 1000).toLocaleDateString("zh-CN", { month: "numeric", day: "numeric" });
}
function dur(s) {
  if (s == null || s < 0) return "";
  if (s < 1) return "<1s";
  if (s < 60) return `${Math.round(s)}s`;
  const m = Math.floor(s / 60), r = Math.round(s % 60);
  return m < 60 ? `${m}m${String(r).padStart(2, "0")}s` : `${Math.floor(m / 60)}h${String(m % 60).padStart(2, "0")}m`;
}
let popEl = null;
function closePop() { popEl?.remove(); popEl = null; }
function openPop(anchor, html, onClick) {
  closePop();
  popEl = document.createElement("div");
  popEl.className = "pop";
  popEl.innerHTML = html;
  document.body.appendChild(popEl);
  const r = anchor.getBoundingClientRect();
  const w = popEl.offsetWidth, h = popEl.offsetHeight;
  popEl.style.left = Math.max(8, Math.min(r.left, innerWidth - w - 8)) + "px";
  popEl.style.top = (r.bottom + h + 6 > innerHeight ? Math.max(8, r.top - h - 6) : r.bottom + 6) + "px";
  popEl.onclick = (e) => { const b = e.target.closest("button[data-act]"); if (b) { closePop(); onClick(b.dataset.act, b); } };
  setTimeout(() => document.addEventListener("click", outside, { once: true }), 0);
  function outside(e) { if (popEl && !popEl.contains(e.target)) closePop(); else if (popEl) document.addEventListener("click", outside, { once: true }); }
}

// ---------- 主题、连接 ----------
const themes = ["auto", "light", "dark"];
let theme = store.get("wwk.theme", "auto");
function applyTheme() {
  if (theme === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", theme);
  $("theme-btn").innerHTML = icon("sun") + { auto: "外观：跟随系统", light: "外观：浅色", dark: "外观：深色" }[theme];
}
$("theme-btn").onclick = () => { theme = themes[(themes.indexOf(theme) + 1) % 3]; store.set("wwk.theme", theme); applyTheme(); };
function setConn(ok, text) { $("conn-dot").className = "dot " + (ok ? "ok" : "bad"); $("conn-text").textContent = text; }

// ---------- 状态 ----------
let AGENTS = { agents: [], reviewers: [] };
let WS = [];                 // 工作空间（含最近一次运行）
let current = store.get("wwk.ws", null);   // 选中的工作空间路径
let view = "ws";             // ws：工作空间；settings：设置页
let RUNS = [];               // 当前工作空间的运行记录
let run = null;              // 正在看的运行（含事件）
let runFilter = "all";       // 日志按阶段筛选
let follow = true;           // 运行中自动滚到最新日志
let design = null;           // 本次附带的设计稿
let images = [];             // 本次附带的界面图片（图片 + 文字输入），和设计稿二选一
let pollTimer = null;
const openGroups = new Set();

const wsOf = (path) => WS.find((w) => w.path === path);
const agentLabel = (k) => AGENTS.agents.find((a) => a.key === k)?.label || k;
const reviewerLabel = (k) => (AGENTS.reviewers.find((r) => r.key === k)?.label || k).replace(/（.*$/, "");
function prefOf(ws, k) {
  const p = ws?.prefs || {};
  if (p[k]) return p[k];
  return { coding_agent: AGENTS.default, fix_agent: AGENTS.fix_default, review_backend: AGENTS.review_default, ...(AGENTS.role_defaults || {}) }[k] || "";
}

const RSTATUS = {
  running: ["运行中", "running", "accent"], delivered: ["已交付", "ok", "ok"], passed: ["门禁通过", "ok", "ok"],
  broken: ["已熔断", "bad", "bad"], failed: ["门禁未通过", "bad", "bad"], config_error: ["规则有误", "bad", "bad"],
  error: ["运行出错", "bad", "bad"], done: ["已结束", "", ""],
};
function statusKey(r) { return !r ? "none" : r.status === "running" ? "running" : r.status === "error" ? "error" : (r.result_status || r.result?.status || "done"); }
const statusText = (r) => (RSTATUS[statusKey(r)] || ["未运行"])[0];
const statusDot = (r) => (RSTATUS[statusKey(r)] || ["", ""])[1];
const runTitle = (r) => r.requirement || (r.graph === FIX_LOOP ? "门禁修复回环" : r.graph === GATE_ONLY ? "只跑门禁" : r.graph);

// ---------- 侧栏：工作空间 ----------
function renderSide() {
  const list = $("ws-list");
  if (!WS.length) { list.innerHTML = `<li class="ws" style="cursor:default;color:var(--faint)">还没有项目</li>`; return; }
  list.innerHTML = WS.map((w) => {
    const r = w.last_run;
    const sub = r ? `${statusText(r)} · ${ago(r.started)}` : (w.inspect?.exists === false ? "目录不存在" : "未运行");
    return `<li class="ws" data-path="${esc(w.path)}" aria-current="${view === "ws" && w.path === current}" title="${esc(w.path)}">
      <span class="dot ${statusDot(r)}"></span>
      <div class="grow"><div class="name">${esc(w.name)}</div><div class="sub">${esc(sub)}${w.branch ? " · " + esc(w.branch) : ""}</div></div>
      <button class="btn icon ghost more" type="button" data-more="${esc(w.path)}" aria-label="更多操作">${icon("more")}</button></li>`;
  }).join("");
}
$("ws-list").onclick = (e) => {
  const more = e.target.closest("[data-more]");
  if (more) {
    e.stopPropagation();
    const path = more.dataset.more;
    openPop(more, `<button data-act="open">${icon("folder")}在文件管理器中打开</button><div class="sep"></div><button class="danger" data-act="remove">${icon("trash")}从工作空间移除</button>`,
      (act) => act === "open" ? openFolder(path) : removeWs(path));
    return;
  }
  const li = e.target.closest(".ws[data-path]");
  if (li) selectWs(li.dataset.path);
};

async function pickFolder() {
  if (desktop) return desktop.pickFolder(current);
  return (await post("/api/pick-folder", { initial: current })).path;
}
async function addWs() {
  try {
    const path = await pickFolder();
    if (!path) return;
    const ws = await post("/api/workspaces/add", { path });
    await loadWs();
    selectWs(ws.path);
    toast(`已添加 ${ws.name}`);
  } catch (err) { toast(err.message, true); }
}
async function removeWs(path) {
  const w = wsOf(path);
  if (!confirm(`从工作空间移除「${w?.name || path}」？\n只是不再显示在列表里，不会删除项目里的任何文件。`)) return;
  try {
    await post("/api/workspaces/remove", { path });
    if (current === path) current = null;
    await loadWs();
    selectWs(current || WS[0]?.path || null);
  } catch (err) { toast(err.message, true); }
}
async function openFolder(path) {
  try { await post("/api/open", { path }); } catch (err) { toast(err.message, true); }
}
$("add-ws").innerHTML = icon("plus");
$("add-ws").onclick = addWs;

async function loadWs() {
  WS = await api("/api/workspaces");
  renderSide();
  renderPending();
}

// ---------- Agent 状态 ----------
$("agents-btn").innerHTML = icon("gear") + "设置：账号、Key 与代理";
$("agents-btn").onclick = () => { view = "settings"; renderSide(); renderMain(); };

// ---------- 主区 ----------
function selectWs(path) {
  view = "ws";
  current = path;
  store.set("wwk.ws", path);
  run = null; runFilter = "all"; design = null; openGroups.clear();
  renderSide();
  renderMain();
  if (path) refreshRuns(true);
}

function renderMain() {
  $("agents-btn").setAttribute("aria-current", String(view === "settings"));
  if (view === "settings") return renderSettings();
  const ws = wsOf(current);
  if (!ws) {
    $("main").innerHTML = `<div class="blank"><div class="card"><h2>添加你的第一个项目</h2>
      <p>选一个前端项目目录作为工作空间。之后需求、agent 选择、运行记录都按项目保存。</p>
      <button class="btn primary" id="blank-add" type="button">${icon("plus")}添加项目</button></div></div>`;
    $("blank-add").onclick = addWs;
    return;
  }
  const ins = ws.inspect || {};
  const draft = store.get("wwk.draft." + ws.path, "");
  $("main").innerHTML = `
    <header class="toolbar">
      <div class="title"><h2>${esc(ws.name)}</h2>
        <div class="meta">${ws.branch ? `<span class="tag">${esc(ws.branch)}</span>` : ""}
          <span class="tag ${ins.rules_yaml ? "ok" : "warn"}">${ins.rules_yaml ? "rules.yaml" : "无 rules.yaml"}</span>
          <span class="path" title="${esc(ws.path)}">${esc(ws.path)}</span></div></div>
      <div class="tools">
        <button class="btn" id="t-gate" type="button" title="只跑一次门禁，不改代码">${icon("shield")}跑门禁</button>
        <button class="btn" id="t-loop" type="button" title="对当前工作区跑门禁，失败就审阅修复，直到通过或熔断">${icon("loop")}修复回环</button>
        <button class="btn" id="t-metrics" type="button" title="按 agent 汇总最近的运行：耗时、token、被打回的次数和原因">${icon("cpu")}指标</button>
        <button class="btn" id="t-open" type="button">${icon("folder")}打开目录</button>
      </div>
    </header>
    <div id="pending-slot"></div>
    ${ins.exists === false ? `<div class="banner"><span class="grow">这个目录已经不存在了。</span><button class="btn" id="b-remove" type="button">从工作空间移除</button></div>`
      : !ins.rules_yaml ? `<div class="banner"><span class="grow">项目里还没有 rules.yaml，门禁会用默认规则（命令不一定和项目一致）。</span><button class="btn warn" id="b-init" type="button">${icon("wand")}生成配置</button></div>` : ""}
    <section class="compose">
      <textarea id="req" placeholder="描述这次要做的需求，例如：订单列表加“导出 Excel”按钮，按当前筛选条件导出">${esc(draft)}</textarea>
      <div class="recent" id="recent"></div>
      <div class="choices" id="choices"></div>
      <div class="compose-foot">
        <span class="grow" id="compose-err"></span>
        <span id="design-slot"></span>
        <button class="btn primary" id="run-btn" type="button">${icon("play")}运行 <kbd>${/Mac/.test(navigator.platform) ? "⌘" : "Ctrl"}↵</kbd></button>
      </div>
    </section>
    <section class="work">
      <aside class="runs"><h3>运行记录</h3><ul id="run-list"></ul></aside>
      <div class="detail" id="detail"></div>
    </section>`;

  $("t-gate").onclick = () => startRun(GATE_ONLY);
  $("t-loop").onclick = () => startRun(FIX_LOOP);
  $("t-open").onclick = () => openFolder(ws.path);
  $("t-metrics").onclick = () => openMetrics(ws.path);
  $("b-init")?.addEventListener("click", initProject);
  $("b-remove")?.addEventListener("click", () => removeWs(ws.path));
  renderPending();
  $("run-btn").onclick = () => startRun(PIPELINE);
  const req = $("req");
  req.oninput = () => { store.set("wwk.draft." + ws.path, req.value); $("compose-err").textContent = ""; };
  req.onkeydown = (e) => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); startRun(PIPELINE); } };
  renderChoices();
  renderDesign();
  loadPreview();
  renderRecent();
  renderRunList();
  renderDetail();
}

// ---------- 编程 / 修复 / 审阅：一行彩色标签 + 选择弹窗 ----------
// [字段, 名称, 颜色, 可选项]；按流程顺序排。需求、复核、验收必须是同一个 agent（product），技术设计和实现核对也是同一个（tech）
const ROLES = [
  ["product_agent", "需求·复核·验收", "product", () => AGENTS.agents],
  ["tech_agent", "技术设计·核对", "tech", () => AGENTS.agents],
  ["coding_agent", "编程", "code", () => AGENTS.agents],
  ["fix_agent", "修复", "fix", () => AGENTS.agents],
  ["review_backend", "修复审阅", "review", () => AGENTS.reviewers],
  ["vision_agent", "看图", "vision", () => AGENTS.vision_agents || []],
  ["arbiter_agent", "仲裁", "arbiter", () => AGENTS.agents],
];
const ROLE_HINT = {
  product_agent: "同一个 agent 负责写需求（02）、复核技术设计（04）和最后的产品验收（06）。",
  tech_agent: "同一个 agent 负责写技术设计（03），并在写完代码后核对实现是否和设计对得上。",
  vision_agent: "只在带图片的需求里用：看图写设计分析（01）。",
  arbiter_agent: "文档复核超过轮次仍没通过时，由它判定技术设计能否继续。",
};
const ROLE_OPTION_PREFIX = {
  product_agent: "product",
  tech_agent: "tech",
  coding_agent: "coding",
  fix_agent: "fix",
  review_backend: "review",
  vision_agent: "vision",
  arbiter_agent: "arbiter",
};
const RUN_ROLE_FIELDS = [
  "product_agent", "product_model", "product_effort",
  "tech_agent", "tech_model", "tech_effort",
  "coding_agent", "coding_model", "coding_effort",
  "fix_agent", "fix_model", "fix_effort",
  "review_backend", "review_model", "review_effort",
  "vision_agent", "vision_model", "vision_effort",
  "arbiter_agent", "arbiter_model", "arbiter_effort",
];
const optLabel = (key, o) => (key === "review_backend" ? reviewerLabel(o.key) : o.label);
const isPath = (d) => /[\\/]/.test(d || "");
// 可用时的说明：编程 agent 给的是可执行文件路径，显示「已安装」，路径放进悬停提示
const availText = (d) => (isPath(d) ? `<span title="${esc(d)}">已安装</span>` : esc(d || ""));
function renderChoices() {
  const box = $("choices"), ws = wsOf(current);
  if (!box || !ws) return;
  box.innerHTML = ROLES.map(([key, name, cls, list]) => {
    const v = prefOf(ws, key), o = list().find((x) => x.key === v);
    const label = o ? optLabel(key, o) : v || "未选";
    const prefix = ROLE_OPTION_PREFIX[key], model = prefOf(ws, `${prefix}_model`), effort = prefOf(ws, `${prefix}_effort`);
    const detail = [model, effort && `思考 ${effort}`].filter(Boolean).join(" · ");
    return `<button class="role-tag ${cls}${o && !o.available ? " na" : ""}" type="button" data-k="${key}" title="${esc(o && !o.available ? o.detail || "本机不可用" : [`点击更改${name} agent`, detail].filter(Boolean).join("；"))}"><span class="k">${name}</span><b>${esc(label)}${detail ? `<small> · ${esc(detail)}</small>` : ""}</b>${o && !o.available ? " ⚠" : ""}</button>`;
  }).join("");
  box.onclick = (e) => { const b = e.target.closest("[data-k]"); if (b) openChoices(b.dataset.k); };
}
const whyHtml = (key, list) => {
  const o = list().find((x) => x.key === prefOf(wsOf(current), key));
  return o ? (o.available ? availText(o.detail) : esc(`本机不可用：${o.detail || ""}`)) : "";
};
const optionCache = new Map();
const roleAgent = (key, value) => (ROLES.find((r) => r[0] === key)?.[3]() || AGENTS.agents).find((a) => a.key === value);
const unsupportedControl = (reason) => ({ supported: false, source: null, choices: [], reason });
function controlsFor(key, agent) {
  if (key === "review_backend" && !AGENTS.agents.some((a) => a.key === agent))
    return { model: unsupportedControl("这个审阅后端不接受模型设置"), effort: unsupportedControl("这个审阅后端不接受思考强度") };
  return agent?.controls || { model: unsupportedControl("这个 agent 没有报告模型能力"), effort: unsupportedControl("这个 agent 没有报告思考强度能力") };
}
const optionValue = (ws, prefix, kind) => prefOf(ws, `${prefix}_${kind}`);

/** 点哪个标签就只改这一项；模型 / 思考强度也属于这一角色的设置。 */
function openChoices(focus) {
  const dlg = $("choice-dlg"), ws = wsOf(current);
  const role = ROLES.find((r) => r[0] === focus);
  if (!ws || !role) return;
  const [key, name, , list] = role;
  // 只在打开时生成一次；切换时就地改高亮和说明，不重建（重建会闪、丢焦点）
  dlg.innerHTML = `<header><h3 id="choice-title">设置${name} agent</h3><button class="btn icon ghost" id="ch-x" type="button" aria-label="关闭">${icon("x")}</button></header>
    <div class="body picker">${segHtml(key, "Agent", list().map((x) => [x.key, optLabel(key, x), x.available, x.detail]), prefOf(ws, key))}
      <div class="why" data-why="${key}">${whyHtml(key, list)}</div>
      <div id="agent-options-slot"></div>
      <div class="why">${esc(ROLE_HINT[key] || "")}建议各环节选不同的 agent，避免同源偏差。每个项目记住自己的选择。</div></div>
    <footer><span class="grow"></span><button class="btn primary" id="ch-ok" type="button">完成</button></footer>`;
  $("ch-x").onclick = $("ch-ok").onclick = () => dlg.close();
  const seg = dlg.querySelector(".seg"), group = seg.closest(".choice");
  seg.onclick = async (e) => {
    const b = e.target.closest("button[data-v]");
    if (!b || group.classList.contains("busy") || b.getAttribute("aria-pressed") === "true") return;
    const mark = (v) => {
      seg.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x.dataset.v === v)));
      dlg.querySelector(`[data-why="${key}"]`).innerHTML = whyHtml(key, list);
      renderChoices();
    };
    const prev = prefOf(ws, key);
    // 保存期间这一组不能再点；超过 150ms 才显示转圈，快的话看不到
    group.classList.add("busy");
    const slow = setTimeout(() => group.classList.add("loading"), 150);
    mark(b.dataset.v);   // 先切过去，不等保存
    const ok = await changeRoleAgent(key, b.dataset.v);
    clearTimeout(slow);
    group.classList.remove("busy", "loading");
    if (!ok) mark(prev);
    else await refreshRoleOptions(key, b.dataset.v);
  };
  if (!dlg.open) dlg.showModal();
  refreshRoleOptions(key, prefOf(ws, key));
  dlg.querySelector(`.seg[data-k="${focus}"] button[aria-pressed="true"]`)?.focus();
}

function segHtml(key, label, opts, chosen) {
  return `<div class="choice"><span>${label}</span><div class="seg" data-k="${key}" role="group" aria-label="${label}">${opts.map(([k, l, ok, d]) =>
    `<button type="button" data-v="${esc(k)}" aria-pressed="${k === chosen}" class="${ok ? "" : "na"}" title="${esc(ok ? (isPath(d) ? `已安装：${d}` : d || l) : d || "本机不可用")}">${esc(l)}</button>`).join("")}</div></div>`;
}
/** 更新角色 agent；新 agent 不支持模型 / 强度时明确清掉旧值，避免留下“看似生效”的配置。 */
async function changeRoleAgent(key, value) {
  const ws = wsOf(current);
  const opt = roleAgent(key, value);
  if (opt && !opt.available) toast(`${opt.label || value}：${opt.detail || "本机不可用"}。仍可选择，运行时会失败。`, true);
  const prefix = ROLE_OPTION_PREFIX[key], controls = controlsFor(key, opt), changes = { [key]: value };
  const dropped = [];
  for (const kind of ["model", "effort"]) {
    const field = `${prefix}_${kind}`;
    if (optionValue(ws, prefix, kind) && !controls[kind].supported) {
      changes[field] = "";
      dropped.push(kind === "model" ? "模型" : "思考强度");
    }
  }
  const ok = await savePreferences(changes);
  if (ok && dropped.length) toast(`${opt?.label || value} 不支持${dropped.join("和")}，已清除这两个角色设置。`);
  return ok;
}

/** 保存一组工作空间偏好；先在本地改好，失败再改回去。 */
async function savePreferences(values) {
  const ws = wsOf(current);
  const before = { ...(ws.prefs || {}) };
  ws.prefs = { ...before, ...values };
  for (const [key, value] of Object.entries(values)) if (!value) delete ws.prefs[key];
  renderChoices();
  try {
    const updated = await post("/api/workspaces/prefs", { path: ws.path, prefs: values });
    Object.assign(ws, { prefs: updated.prefs });
    renderChoices();
    return true;
  } catch (err) {
    ws.prefs = before;
    renderChoices();
    toast(err.message, true);
    return false;
  }
}

function optionSelect(label, key, controls, current) {
  const list = [...(controls.choices || [])];
  if (current && !list.some((o) => o.value === current)) list.unshift({ value: current, name: `${current}（当前配置）` });
  const disabled = !controls.supported;
  const reason = controls.reason ? `<div class="why">${esc(controls.reason)}</div>` : "";
  return `<label class="agent-option"><span>${label}</span><select data-opt="${key}" ${disabled ? "disabled" : ""}>
    <option value="">${current ? "不使用角色级设置（agent 默认）" : "跟随 agent / 角色默认"}</option>
    ${list.map((o) => `<option value="${esc(o.value)}" ${o.value === current ? "selected" : ""}>${esc(o.name)}</option>`).join("")}
  </select>${reason}</label>`;
}

function renderRoleOptions(focus, agentKey, controls, error = "") {
  const slot = $("agent-options-slot"), ws = wsOf(current);
  if (!slot || !ws) return;
  const prefix = ROLE_OPTION_PREFIX[focus];
  if (!agentKey) {
    slot.innerHTML = `<div class="agent-options"><div class="why">先选择一个 agent，再设置模型和思考强度。</div></div>`;
    return;
  }
  if (!controls) {
    slot.innerHTML = `<div class="agent-options"><div class="loading-line">${error ? esc(error) : `<span class="spin"></span> 正在读取 ${esc(agentLabel(agentKey))} 的可用选项…`}</div></div>`;
    return;
  }
  slot.innerHTML = `<div class="agent-options">
    ${optionSelect("模型", "model", controls.model, optionValue(ws, prefix, "model"))}
    ${optionSelect("思考强度", "effort", controls.effort, optionValue(ws, prefix, "effort"))}
  </div>`;
  slot.querySelectorAll("select[data-opt]").forEach((select) => {
    select.onchange = () => changeRoleOption(focus, agentKey, select.dataset.opt, select.value);
  });
}

async function loadRoleControls(focus, agentKey, model) {
  const ws = wsOf(current), agent = roleAgent(focus, agentKey);
  const base = controlsFor(focus, agent);
  if (base.model.source !== "session" && base.effort.source !== "session") return base;
  const q = new URLSearchParams({ project: ws.path, agent: agentKey });
  if (model) q.set("model", model);
  const cacheKey = `${ws.path}|${agentKey}|${model || ""}`;
  if (optionCache.has(cacheKey)) return optionCache.get(cacheKey);
  const data = await api(`/api/agent-options?${q}`);
  optionCache.set(cacheKey, data.controls);
  return data.controls;
}

async function refreshRoleOptions(focus, agentKey, provided) {
  const epoch = (refreshRoleOptions.epoch = (refreshRoleOptions.epoch || 0) + 1);
  const agent = roleAgent(focus, agentKey);
  renderRoleOptions(focus, agentKey, provided || null);
  if (provided) return;
  const base = controlsFor(focus, agent);
  if (base.model.source !== "session" && base.effort.source !== "session") {
    renderRoleOptions(focus, agentKey, base);
    return;
  }
  try {
    const ws = wsOf(current), prefix = ROLE_OPTION_PREFIX[focus];
    const q = new URLSearchParams({ project: ws.path, agent: agentKey });
    const currentModel = optionValue(ws, prefix, "model");
    if (currentModel) q.set("model", currentModel);
    const cacheKey = `${ws.path}|${agentKey}|${currentModel || ""}`;
    let controls = optionCache.get(cacheKey);
    if (!controls) {
      controls = (await api(`/api/agent-options?${q}`)).controls;
      optionCache.set(cacheKey, controls);
    }
    if (epoch === refreshRoleOptions.epoch) renderRoleOptions(focus, agentKey, controls);
  } catch (err) {
    if (epoch === refreshRoleOptions.epoch) renderRoleOptions(focus, agentKey, null, err.message);
  }
}

async function changeRoleOption(focus, agentKey, kind, value) {
  const prefix = ROLE_OPTION_PREFIX[focus], field = `${prefix}_${kind}`;
  if (!await savePreferences({ [field]: value })) {
    await refreshRoleOptions(focus, agentKey);
    return;
  }
  if (kind !== "model") return;
  try {
    const controls = await loadRoleControls(focus, agentKey, value);
    renderRoleOptions(focus, agentKey, controls);
    const ws = wsOf(current), effort = optionValue(ws, prefix, "effort");
    if (effort && controls.effort.choices.length && !controls.effort.choices.some((o) => o.value === effort)) {
      await savePreferences({ [`${prefix}_effort`]: "" });
      toast(`${value} 不支持原思考强度「${effort}」，已恢复为默认。`);
      renderRoleOptions(focus, agentKey, controls);
    }
  } catch (err) {
    toast(err.message, true);
    await refreshRoleOptions(focus, agentKey);
  }
}

// 设计稿：一键用 MasterGo 当前选中，或选本地导出的 .json
function renderDesign() {
  const slot = $("design-slot");
  if (!slot) return;
  const chip = (label, title, id, aria) => `<span class="btn design-chip" title="${esc(title)}">${icon("clip")}<span>${esc(label)}</span><button class="btn icon ghost" id="${id}" type="button" aria-label="${aria}" style="height:20px;width:20px">${icon("x")}</button></span>`;
  slot.innerHTML = design
    ? chip(design === "mastergo" ? "MasterGo 当前选中" : design.split("/").pop(), design, "d-clear", "不带设计稿")
    : images.length
      ? chip(images.length === 1 ? images[0].split("/").pop() : `${images.length} 张图片`, images.join("\n"), "i-clear", "不带图片")
      : `<button class="btn ghost" id="i-pick" type="button" title="截图或设计稿导出图，由 Codex 看图写设计分析">${icon("clip")}图片</button><button class="btn ghost" id="d-pick" type="button">${icon("clip")}设计稿</button>`;
  $("d-clear")?.addEventListener("click", () => { design = null; renderDesign(); });
  $("i-clear")?.addEventListener("click", () => { images = []; renderDesign(); });
  $("i-pick")?.addEventListener("click", async () => {
    try { images = desktop?.pickImages ? await desktop.pickImages(current) : (await post("/api/pick-images", { initial: current })).paths; }
    catch (err) { toast(err.message, true); }
    renderDesign();
  });
  $("d-pick")?.addEventListener("click", (e) => openPop(e.currentTarget,
    `<button data-act="file">${icon("folder")}选择导出的 .json…</button><button data-act="mastergo">${icon("clip")}用 MasterGo 当前选中的图层</button>`,
    async (act) => {
      if (act === "mastergo") design = "mastergo";
      else {
        try { design = desktop ? await desktop.pickFile(current) : (await post("/api/pick-file", { initial: current })).path; }
        catch (err) { toast(err.message, true); }
      }
      renderDesign();
    }));
}

function renderRecent() {
  const el = $("recent");
  if (!el) return;
  const seen = new Set();
  const reqs = RUNS.map((r) => r.requirement).filter((q) => q && !seen.has(q) && seen.add(q)).slice(0, 4);
  el.innerHTML = reqs.length ? `<span style="color:var(--faint);font-size:12px">最近：</span>` + reqs.map((q) => `<button type="button" title="${esc(q)}">${esc(q)}</button>`).join("") : "";
  el.style.display = reqs.length ? "" : "none";
  el.onclick = (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    $("req").value = b.title;
    store.set("wwk.draft." + current, b.title);
    $("req").focus();
  };
}

async function initProject() {
  const ws = wsOf(current);
  try {
    const { created } = await post("/api/init", { path: ws.path });
    toast(created.length ? `已生成 ${created.join("、")}，请按项目实际的脚本修改 rules.yaml` : "配置文件已存在，没有覆盖");
    await loadWs();
    renderMain();
  } catch (err) { toast(err.message, true); }
}

async function startRun(graph) {
  const ws = wsOf(current);
  if (!ws) return;
  const input = {
    project_root: ws.path,
    review_backend: prefOf(ws, "review_backend"), review_model: prefOf(ws, "review_model"), review_effort: prefOf(ws, "review_effort"),
    fix_agent: prefOf(ws, "fix_agent"), fix_model: prefOf(ws, "fix_model"), fix_effort: prefOf(ws, "fix_effort"),
  };
  if (graph === PIPELINE) {
    const requirement = $("req").value.trim();
    if (!requirement) { $("compose-err").textContent = "先写下这次要做的需求"; $("req").focus(); return; }
    Object.assign(input, { requirement });
    for (const k of RUN_ROLE_FIELDS) input[k] = prefOf(ws, k);
    if (design) input.design_ref = design;
    if (images.length) input.images = images;
    // 跑完要合并时发通知；趁这次点击要权限（桌面端不需要）
    if ("Notification" in window && Notification.permission === "default") Notification.requestPermission().catch(() => {});
  }
  if (graph === GATE_ONLY) for (const k of ["review_backend", "review_model", "review_effort", "fix_agent", "fix_model", "fix_effort"]) delete input[k];
  try {
    const { id } = await post("/api/runs", { graph, input });
    if (graph === PIPELINE) { $("req").value = ""; store.set("wwk.draft." + ws.path, ""); design = null; images = []; renderDesign(); }
    run = null; runFilter = "all"; openGroups.clear(); follow = true;
    await refreshRuns(false);
    openRun(id);
    loadWs();
  } catch (err) {
    if (err.problems && graph === PIPELINE) showProblems(err.problems);
    else toast(err.message, true);
  }
}

// ---------- 作业分支：开工检查、合并弹窗 ----------
const FLOW_STATUS = { running: ["作业分支", ""], ready_to_merge: ["待合并", "accent"], held: ["待处理", "warn"], merged: ["已合并", "ok"], failed: ["未合并", ""] };
const isPending = (f) => f && (f.status === "ready_to_merge" || f.status === "held");

function showProblems(problems) {
  const el = $("compose-err");
  if (!el) return;
  el.innerHTML = `<div class="problems">${problems.map((p, i) => `<div class="p"><span>${esc(p.message)}</span>${
    p.code === "GITIGNORE" ? `<button class="btn" type="button" data-fix="${i}">一键修复</button>`
    : p.code === "PENDING" ? `<button class="btn" type="button" data-fix="${i}">去处理</button>`
    : p.code === "INTERRUPTED" ? `<button class="btn" type="button" data-fix="${i}">收尾</button>`
    : p.code === "DIRTY" && p.detail ? `<span class="tag" title="${esc(p.detail.join("\n"))}">${esc(p.detail.slice(0, 3).join("、"))}${p.detail.length > 3 ? " …" : ""}</span>` : ""}</div>`).join("")}</div>`;
  el.onclick = async (e) => {
    const b = e.target.closest("[data-fix]");
    if (!b) return;
    const p = problems[Number(b.dataset.fix)];
    if (p.code === "PENDING") return handlePending(p.detail[0]);
    if (p.code === "INTERRUPTED") {
      if (!confirm("会把中断运行留下的未提交改动存成 patch 后清掉，切回原分支，并把这次运行标为失败（作业分支按保留策略处理）。继续？")) return;
      try {
        for (const id of p.detail) await post("/api/flow/abandon", { project: current, run: id });
        toast("已收尾，可以重新运行");
        el.innerHTML = "";
        await loadWs();
        refreshRuns(false);
      } catch (err) { toast(err.message, true); }
      return;
    }
    if (!confirm("会把 .agent/ 追加到 .gitignore，并在当前分支上单独提交一次（只含 .gitignore）。继续？")) return;
    try {
      await post("/api/workspaces/fix-gitignore", { path: current });
      toast("已忽略 .agent/ 并提交");
      el.innerHTML = "";
      await loadWs();
    } catch (err) { toast(err.message, true); }
  };
}

/** 待合并 / 待处理的运行：横幅单独刷新，不重绘整个主区（免得打断正在写的需求） */
function renderPending() {
  const slot = $("pending-slot"), ws = wsOf(current);
  if (!slot || !ws) return;
  const ids = ws.pending_runs || [];
  slot.innerHTML = ids.length ? `<div class="banner"><span class="grow">有 ${ids.length} 次运行在等你处理（合并 / 不合并 / 作废），处理完才能开新运行。</span><button class="btn" id="b-pending" type="button">处理</button></div>` : "";
  $("b-pending")?.addEventListener("click", () => handlePending(ids[0]));
}

async function handlePending(id) {
  if (!id) return;
  follow = false; runFilter = "all"; openGroups.clear();
  await openRun(id);
  openMerge(id);
}

function notifyDesk(title, body) {
  if (!("Notification" in window) || Notification.permission !== "granted") return;
  if (!document.hidden && document.hasFocus()) return;
  try { new Notification(title, { body }); } catch {}
}

// ---------- 指标：按 agent 汇总 ----------
const REJECT_BY = { gate: "门禁", lint: "文档校验", "doc-review": "文档复核", arbiter: "仲裁", "impl-review": "实现核对", acceptance: "验收", whitelist: "越界" };
const fmtTok = (n) => n >= 10000 ? (n / 1000).toFixed(0) + "k" : n >= 1000 ? (n / 1000).toFixed(1) + "k" : String(n);
async function openMetrics(project) {
  let data;
  try { data = await api("/api/metrics?project=" + encodeURIComponent(project)); } catch (err) { toast(err.message, true); return; }
  const dlg = $("metrics-dlg");
  const rows = data.agents.map((a) => {
    const rej = Object.entries(a.rejected).map(([k, n]) => `${REJECT_BY[k] || k} ${n}`).join("、") || "—";
    const tok = a.tokens.calls_with_usage ? `${fmtTok(a.tokens.input)} / ${fmtTok(a.tokens.output)}${a.tokens.calls_with_usage < a.calls ? `（${a.tokens.calls_with_usage}/${a.calls} 次有用量）` : ""}` : "拿不到";
    return `<tr><td><b>${esc(agentLabel(a.agent))}</b><div class="why">${esc(a.roles.join("、"))}</div></td>
      <td class="num">${a.calls}${a.errors ? ` <span class="tag bad">出错 ${a.errors}</span>` : ""}</td>
      <td class="num">${a.calls ? dur(a.ms / a.calls / 1000) : "—"}</td><td class="num">${tok}</td><td>${esc(rej)}</td>
      <td class="why">${a.top_reasons.map((r) => `${esc(r.reason)} ×${r.count}`).join("<br>") || "—"}</td></tr>`;
  }).join("");
  dlg.innerHTML = `<header><h3 id="metrics-title">指标（最近 ${data.runs} 次运行）</h3><button class="btn icon ghost" id="mt-x" type="button" aria-label="关闭">${icon("x")}</button></header>
    <div class="body">${rows ? `<table class="mtable"><thead><tr><th>agent</th><th>调用</th><th>平均耗时</th><th>token 输入 / 输出</th><th>产出被打回</th><th>常见打回原因</th></tr></thead><tbody>${rows}</tbody></table>`
      : `<div class="rehearsal">还没有指标：完整流水线跑过之后，这里会按 agent 汇总耗时、token 和打回原因。</div>`}</div>`;
  $("mt-x").onclick = () => dlg.close();
  if (!dlg.open) dlg.showModal();
}

let MERGE = null;   // { project, runId, data, target, message, timer, busy }
async function openMerge(runId) {
  const ws = wsOf(current);
  if (!ws) return;
  clearTimeout(MERGE?.timer);
  MERGE = { project: ws.path, runId, data: null, target: null, message: null, timer: null, busy: false };
  await loadMerge();
  const dlg = $("merge-dlg");
  if (MERGE && !dlg.open) dlg.showModal();
}
async function loadMerge() {
  const m = MERGE;
  if (!m) return;
  try {
    m.data = await api(`/api/flow?project=${encodeURIComponent(m.project)}&run=${encodeURIComponent(m.runId)}`);
  } catch (err) { toast(err.message, true); closeMerge(); return; }
  if (MERGE !== m) return;
  const r = m.data.manifest.verify.on_merged_result;
  m.target ||= m.data.rehearsing?.target || r?.target || m.data.default_target;
  if (m.message === null) m.message = r?.message || m.data.suggested_message;
  drawMerge();
  clearTimeout(m.timer);
  if (m.data.rehearsing) m.timer = setTimeout(loadMerge, 1500);
}
function closeMerge() {
  clearTimeout(MERGE?.timer);
  MERGE = null;
  const dlg = $("merge-dlg");
  if (dlg.open) dlg.close();
}
function drawMerge() {
  const m = MERGE, dlg = $("merge-dlg");
  const { manifest: mf, targets, rehearsing, error } = m.data;
  const r = mf.verify.on_merged_result;
  const t = targets.find((x) => x.branch === m.target);
  const pending = isPending(mf);
  const fresh = Boolean(r && t && r.target === m.target && r.target_head_before === t.head);
  const canMerge = pending && fresh && r.passed && !rehearsing && t.checked_out !== "elsewhere" && !m.busy;
  const [stText, stTag] = FLOW_STATUS[mf.status] || [mf.status, ""];

  let body;
  if (!pending) {
    body = `<div class="rehearsal ${mf.status === "merged" ? "ok" : ""}">${mf.status === "merged"
      ? `已合并到 <b>${esc(mf.merge.target)}</b>（${esc(mf.merge.result_hash.slice(0, 7))}），作业分支已删除。`
      : esc(mf.note || "这次运行没有可合并的结果。")}</div>`;
  } else {
    const rows = targets.map((x) => {
      const bits = [x.behind ? `比开工时多 ${x.behind} 个新提交` : "开工后没有新提交",
        x.upstream ? `上游 ${esc(x.upstream)}：领先 ${x.upstream_ahead ?? "?"} / 落后 ${x.upstream_behind ?? "?"}` : "没有上游",
        x.conflicts.length ? `<span class="x" title="${esc(x.conflicts.join("\n"))}">冲突 ${x.conflicts.length} 个文件</span>` : "无冲突"];
      if (x.checked_out === "elsewhere") bits.push(`<span class="x">在别的 worktree 检出，不能合并</span>`);
      return `<button class="target" type="button" role="radio" data-b="${esc(x.branch)}" aria-checked="${x.branch === m.target}">
        <div class="n">${esc(x.branch)}${x.checked_out === "here" ? ' <span class="tag">当前分支</span>' : ""}${x.branch === mf.base.branch ? ' <span class="tag">开工分支</span>' : ""}</div>
        <div class="m">${bits.join(" · ")}</div></button>`;
    }).join("");
    let reh;
    if (rehearsing) reh = `<div class="rehearsal"><span class="spin"></span> 正在对 ${esc(rehearsing.target)} 预演（装依赖、跑门禁）…<pre>${esc(rehearsing.log.slice(-30).join("\n"))}</pre></div>`;
    else if (fresh && r.passed) reh = `<div class="rehearsal ok">合并结果的门禁已通过（预演于 ${esc(new Date(r.at).toLocaleString("zh-CN", { hour12: false }))}），可以合并。</div>`;
    else if (fresh) reh = `<div class="rehearsal bad">预演未通过：${esc(r.reason || "")}</div>`;
    else reh = `<div class="rehearsal">还没有对 ${esc(m.target || "")} 预演${r && r.target === m.target ? "（预演后它又有了新提交）" : ""}。合并前会在临时目录里生成合并结果、装依赖并跑一遍门禁，目标分支在这之前不会动。</div>`;
    body = `${error ? `<div class="rehearsal bad">${esc(error)}</div>` : ""}
      <div><div class="lbl">合并到</div><div class="targets" role="radiogroup">${rows || '<div class="m">没有可选的本地分支</div>'}</div></div>
      ${reh}
      <div><div class="lbl">合并方式：squash（压成一个提交）· 提交说明</div><textarea id="m-msg">${esc(m.message)}</textarea></div>
      ${mf.note && mf.status === "held" && !fresh ? `<div class="rehearsal bad">${esc(mf.note)}</div>` : ""}`;
  }

  dlg.innerHTML = `<header><h3 id="merge-title">${esc(mf.requirement.split("\n")[0] || mf.run_id)}</h3><span class="tag ${stTag}">${esc(stText)}</span>
      <button class="btn icon ghost" id="m-x" type="button" aria-label="关闭">${icon("x")}</button></header>
    <div class="body"><div class="m" style="color:var(--muted);font-size:12px">作业分支 <span style="font-family:var(--mono)">${esc(mf.work.branch)}</span> · 从 ${esc(mf.base.branch)} 拉出 · ${mf.work.commits.length} 次阶段提交</div>${body}</div>
    <footer>${pending ? `<button class="btn danger" id="m-discard" type="button">作废</button>` : ""}
      <span class="grow">${pending ? "关掉后可以在运行记录里重新打开" : ""}</span>
      ${mf.status === "ready_to_merge" ? `<button class="btn" id="m-hold" type="button">不合并</button>` : ""}
      ${pending && !(fresh && r.passed) ? `<button class="btn" id="m-reh" type="button" ${rehearsing || !t || m.busy ? "disabled" : ""}>${fresh ? "重新预演" : "预演"}</button>` : ""}
      ${pending ? `<button class="btn primary" id="m-merge" type="button" ${canMerge ? "" : "disabled"}>合并</button>` : `<button class="btn" id="m-close" type="button">关闭</button>`}</footer>`;

  $("m-x").onclick = closeMerge;
  $("m-close")?.addEventListener("click", closeMerge);
  $("m-msg")?.addEventListener("input", (e) => { m.message = e.target.value; });
  dlg.querySelectorAll(".target").forEach((b) => b.onclick = () => { m.target = b.dataset.b; drawMerge(); });
  $("m-reh")?.addEventListener("click", () => flowAction("rehearse"));
  $("m-merge")?.addEventListener("click", () => flowAction("merge"));
  $("m-hold")?.addEventListener("click", () => flowAction("hold"));
  $("m-discard")?.addEventListener("click", () => { if (confirm("作废后不再合并，作业分支按失败分支的保留策略处理（只留最近几个）。继续？")) flowAction("discard"); });
}
async function flowAction(action) {
  const m = MERGE;
  if (!m || m.busy) return;
  m.busy = true;
  drawMerge();
  try {
    m.data = await post(`/api/flow/${action}`, { project: m.project, run: m.runId, target: m.target, message: m.message });
    if (action === "merge") toast(`已合并到 ${m.target}`);
    else if (action === "hold") toast("已标为待处理，作业分支保留");
    else if (action === "discard") toast("已作废");
    if (action !== "rehearse") closeMerge();
  } catch (err) {
    toast(err.message, true);
  } finally {
    m.busy = false;
  }
  if (MERGE === m) loadMerge();
  await loadWs();
  refreshRuns(false);
  if (run && run.id === m.runId) openRun(m.runId);
}

// ---------- 设置页：agent 账号、代理、API Key、熔断邮件 ----------
let SET = null;          // /api/settings 的结果
let AUTH = null;         // /api/auth 的结果（各 agent 登录状态）
let setScope = "user";   // user：全局；project：当前工作空间的 .env
let NET = null;          // 连通性检测结果

const STATE_TAG = { ok: ["可用", "ok"], login: ["未登录", "warn"], key: ["缺 Key", "warn"], missing: ["未安装", "bad"], unknown: ["未知", ""] };
const projectOf = () => (setScope === "project" && wsOf(current) ? wsOf(current).path : "");

async function loadSettings(withAuth) {
  const q = projectOf() ? "?project=" + encodeURIComponent(projectOf()) : "";
  const jobs = [api("/api/settings" + q).then((d) => (SET = d))];
  if (withAuth) { AUTH = null; jobs.push(api("/api/auth" + q).then((d) => (AUTH = d))); }
  await Promise.all(jobs);
}

async function renderSettings() {
  const ws = wsOf(current);
  if (setScope === "project" && !ws) setScope = "user";
  $("main").innerHTML = `<section class="settings" id="settings"><div class="blank"><div class="card"><p>正在读取设置…</p></div></div></section>`;
  try { await loadSettings(!AUTH); } catch (err) { toast(err.message, true); return; }
  drawSettings();
  if (!AUTH) { await loadSettings(true).catch((err) => toast(err.message, true)); drawSettings(); }
}

function drawSettings() {
  const box = $("settings");
  if (!box || !SET) return;
  const ws = wsOf(current);
  const scopeName = setScope === "project" ? `项目：${ws?.name}` : "全局（所有项目）";
  const file = setScope === "project" ? SET.project_file : SET.user_file;
  const group = (g) => SET.items.filter((i) => i.group === g);
  const srcText = { project: "项目 .env", user: "全局 .env", system: "系统环境变量" };
  const field = (it) => {
    const mine = setScope === "project" ? it.project : it.user;
    const eff = it.source && it.source !== (setScope === "project" ? "project" : "user")
      ? `<span class="tag">${it.source === "system" ? "当前生效：系统环境变量" : `当前生效：${srcText[it.source]}`}</span>` : "";
    const input = it.secret
      ? `<input type="password" data-k="${it.key}" placeholder="${esc(mine ? `${mine}（输入新值以替换）` : it.placeholder || "未设置")}" autocomplete="off">`
      : `<input data-k="${it.key}" value="${esc(mine || "")}" placeholder="${esc(it.placeholder || "")}" spellcheck="false">`;
    const acts = [
      it.key === "HTTPS_PROXY" && SET.system_proxy ? `<button class="btn" type="button" data-sys="${esc(SET.system_proxy)}">用系统代理</button>` : "",
      it.test ? `<button class="btn" type="button" data-test="${it.test}">测试</button>` : "",
      mine ? `<button class="btn ghost" type="button" data-clear="${it.key}">清除</button>` : "",
    ].join("");
    return `<div class="field"><div class="lbl">${esc(it.label)}<small>${esc(it.key)}</small></div>${input}<div class="acts">${acts}</div>
      ${it.hint || eff ? `<div class="hint">${eff} ${esc(it.hint || "")}</div>` : ""}</div>`;
  };
  const section = (g, title, extra = "") => `<section class="set-sec" data-g="${g}"><header><h3>${title}</h3>${extra}</header>
    <div class="body">${group(g).map(field).join("")}</div><div class="sec-foot"><button class="btn primary" type="button" data-save="${g}">保存</button></div></section>`;
  const cards = AUTH ? AUTH.map((a) => {
    const [t, c] = STATE_TAG[a.state] || STATE_TAG.unknown;
    const acts = [
      a.installed && a.can_login ? `<button class="btn" type="button" data-login="${a.key}">${a.state === "ok" ? "重新登录" : "登录"}</button>` : "",
      !a.installed && a.install ? `<button class="btn" type="button" data-copy="${esc(a.install)}">复制安装命令</button>` : "",
      a.key === "dsh" && a.state === "key" ? `<button class="btn" type="button" data-goto="DEEPSEEK_API_KEY">填 Key</button>` : "",
    ].join("");
    return `<div class="agent-card"><div class="t"><span class="dot ${c === "ok" ? "ok" : c === "bad" ? "bad" : c === "warn" ? "warn" : ""}"></span>${esc(a.label)}<span class="v">${esc(a.version || "")}</span></div>
      <div><span class="tag ${c}">${t}</span> <span class="d">${esc(a.detail || "")}</span></div><div class="n">${esc(a.note || "")}</div>${acts ? `<div class="acts">${acts}</div>` : ""}</div>`;
  }).join("") : `<div class="d" style="color:var(--faint)">正在检测各 agent…</div>`;
  const net = NET ? `<div class="net-rows">${NET.map((r) => `<div><span class="dot ${r.ok ? "ok" : "bad"}"></span><b style="min-width:170px">${esc(r.name)}</b><span style="color:var(--faint)">${r.status ? "HTTP " + r.status : ""} ${r.ms} ms</span><span style="color:var(--bad)">${esc(r.error || "")}</span></div>`).join("")}</div>` : "";

  box.innerHTML = `
    <div class="set-head"><h2>设置</h2><span class="grow"></span>
      <div class="seg" id="scope-seg"><button type="button" data-scope="user" aria-pressed="${setScope === "user"}">全局（所有项目）</button>
      ${ws ? `<button type="button" data-scope="project" aria-pressed="${setScope === "project"}">项目：${esc(ws.name)}</button>` : ""}</div></div>
    <p class="set-note">正在编辑：${esc(scopeName)} · <code>${esc(file || "")}</code>。项目 .env 覆盖全局；填了对下一次运行生效。密钥只写不读，这里只显示末尾几位。</p>
    ${setScope === "project" && SET.project_env_ignored === false ? `<div class="banner" style="margin:0 0 6px"><span class="grow">这个项目的 .env 没有被 .gitignore 忽略：密钥可能被提交进仓库。先把 .env 加进 .gitignore。</span></div>` : ""}
    <section class="set-sec"><header><h3>Agent 账号</h3><button class="btn ghost" type="button" id="auth-refresh">${icon("loop")}重新检测</button></header><div class="body"><div class="agent-cards">${cards}</div></div></section>
    ${section("proxy", "网络代理", `<button class="btn ghost" type="button" id="net-test">检测连通性</button>`)}
    ${net ? `<div class="set-sec" style="margin-top:-6px;border-top-left-radius:0;border-top-right-radius:0"><div class="body">${net}</div></div>` : ""}
    ${section("keys", "API Key")}
    ${section("mail", "熔断邮件（可选）")}`;

  box.querySelectorAll("[data-scope]").forEach((b) => b.onclick = () => { setScope = b.dataset.scope; NET = null; renderSettings(); });
  $("auth-refresh").onclick = async () => { AUTH = null; drawSettings(); await loadSettings(true).catch((e) => toast(e.message, true)); drawSettings(); };
  $("net-test").onclick = async (e) => {
    e.currentTarget.disabled = true; e.currentTarget.textContent = "检测中…";
    try { NET = await post("/api/settings/test", { kind: "network", project: projectOf() }); } catch (err) { toast(err.message, true); }
    drawSettings();
  };
  box.querySelectorAll("[data-save]").forEach((b) => b.onclick = () => saveGroup(b.dataset.save));
  box.querySelectorAll("[data-clear]").forEach((b) => b.onclick = () => saveValues({ [b.dataset.clear]: "" }, "已清除"));
  // 一键用系统代理：直接保存（只填不存时，用户常以为已经生效）
  box.querySelectorAll("[data-sys]").forEach((b) => b.onclick = () => {
    const np = box.querySelector('input[data-k="NO_PROXY"]')?.value.trim();
    saveValues({ HTTPS_PROXY: b.dataset.sys, HTTP_PROXY: b.dataset.sys, NO_PROXY: np || "127.0.0.1,localhost" },
      `已保存系统代理 ${b.dataset.sys}`);
  });
  box.querySelectorAll("[data-test]").forEach((b) => b.onclick = async () => {
    b.disabled = true;
    // 框里填了还没保存的 Key：先保存再测，否则测的是旧值（或提示“还没有填”）
    const typed = b.closest(".field")?.querySelector("input[data-k]");
    if (typed && typed.value.trim()) await saveValues({ [typed.dataset.k]: typed.value.trim() }, "已保存");
    try { const r = await post("/api/settings/test", { kind: b.dataset.test, project: projectOf() }); toast(r.detail, !r.ok); }
    catch (err) { toast(err.message, true); } finally { b.disabled = false; }
  });
  box.querySelectorAll("[data-login]").forEach((b) => b.onclick = async () => {
    try {
      const r = await post("/api/auth/login", { agent: b.dataset.login, project: projectOf() });
      toast(desktop ? "已在终端里打开登录，完成后点「重新检测」" : `已在终端里打开：${r.line}`);
    } catch (err) { toast(err.message, true); }
  });
  box.querySelectorAll("[data-copy]").forEach((b) => b.onclick = async () => {
    try { if (desktop) await desktop.copy(b.dataset.copy); else await navigator.clipboard.writeText(b.dataset.copy); toast("已复制：" + b.dataset.copy); }
    catch { toast(b.dataset.copy); }
  });
  // 输入框里回车 = 保存所在分组
  box.querySelectorAll("input[data-k]").forEach((el) => el.onkeydown = (e) => {
    if (e.key === "Enter") { e.preventDefault(); saveGroup(el.closest(".set-sec").dataset.g); }
  });
  box.querySelectorAll("[data-goto]").forEach((b) => b.onclick = () => box.querySelector(`input[data-k="${b.dataset.goto}"]`)?.focus());
}

async function saveValues(values, msg) {
  try {
    SET = await post("/api/settings", { scope: setScope, project: projectOf(), values });
    toast(msg || "已保存");
    AGENTS = await api("/api/agents");   // 审阅方式等可用性随 Key 变化
    drawSettings();
  } catch (err) { toast(err.message, true); }
}

function saveGroup(g) {
  const values = {};
  $("settings").querySelectorAll(`.set-sec[data-g="${g}"] input[data-k]`).forEach((el) => {
    const it = SET.items.find((i) => i.key === el.dataset.k);
    if (it.secret) { if (el.value.trim()) values[it.key] = el.value.trim(); }   // 密钥：留空 = 不改
    else values[it.key] = el.value.trim();                                         // 普通值：留空 = 删除
  });
  if (!Object.keys(values).length) return toast("没有要保存的改动");
  saveValues(values);
}

// ---------- 运行记录 ----------
async function refreshRuns(openLatest) {
  if (!current) return;
  const path = current;
  try { RUNS = await api("/api/runs?project=" + encodeURIComponent(path)); } catch (err) { toast(err.message, true); return; }
  if (path !== current) return;
  renderRunList();
  renderRecent();
  if (openLatest && RUNS[0] && !run) openRun(RUNS[0].id);
  else if (!run) renderDetail();
}
function renderRunList() {
  const ul = $("run-list");
  if (!ul) return;
  if (!RUNS.length) { ul.innerHTML = `<li class="empty">还没有运行。写下需求点「运行」，或用工具栏只跑门禁。</li>`; return; }
  ul.innerHTML = RUNS.map((r) => `<li><button class="run-item" type="button" data-id="${esc(r.id)}" aria-current="${r.id === run?.id}">
    <div class="l1"><span class="dot ${statusDot(r)}"></span><span class="t">${esc(runTitle(r))}</span></div>
    <div class="l2">${esc(statusText(r))}${r.flow && r.flow.status !== "running" ? " · " + esc((FLOW_STATUS[r.flow.status] || [r.flow.status])[0]) : ""} · ${esc(ago(r.started))}${r.coding_agent ? " · " + esc(agentLabel(r.coding_agent)) : ""}</div></button></li>`).join("");
  ul.onclick = (e) => { const b = e.target.closest("[data-id]"); if (b) { follow = true; openGroups.clear(); runFilter = "all"; openRun(b.dataset.id); } };
}

async function openRun(id) {
  clearTimeout(pollTimer);
  const path = current;
  try {
    const data = await api(`/api/runs/${id}?project=${encodeURIComponent(path)}`);
    if (path !== current) return;
    run = data;
  } catch (err) { toast(err.message, true); return; }
  renderRunList();
  renderDetail();
  if (run.status === "running") poll();
}
async function poll() {
  clearTimeout(pollTimer);
  if (!run || run.status !== "running") return;
  const id = run.id, path = current;
  try {
    const data = await api(`/api/runs/${id}?project=${encodeURIComponent(path)}&after=${run.next}`);
    if (!run || run.id !== id || path !== current) return;
    run = { ...data, events: run.events.concat(data.events) };
    renderDetail();
    if (run.status !== "running") {
      await refreshRuns(false);
      loadWs();
      if (isPending(run.flow)) {
        notifyDesk(run.flow.status === "ready_to_merge" ? "可以合并了" : "合并预演没通过", runTitle(run));
        openMerge(run.id);
      }
      return;
    }
  } catch { /* 服务短暂不可用时继续轮询 */ }
  pollTimer = setTimeout(poll, 1000);
}
setInterval(() => { if (run?.status === "running") renderDuration(); }, 1000);

// ---------- 阶段：由事件推出流程进度与分组日志 ----------
const CONTAINERS = new Set(["编码", "审阅修复"]);
