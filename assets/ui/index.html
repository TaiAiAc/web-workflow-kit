const STEP_LABEL = { "读取设计稿": "设计稿", "生成Spec": "Spec", "写代码": "写代码", "门禁": "门禁", "修复审阅": "审阅", "执行修复": "修复", "交付": "交付", "熔断": "熔断", "合并预演": "合并预演", "取材与需求": "取材与需求", "技术设计": "技术设计", "文档复核": "文档复核", "实现核对": "实现核对", "产品验收": "产品验收" };
const TEMPLATE = { [PIPELINE]: ["取材与需求", "技术设计", "文档复核", "写代码", "实现核对", "门禁", "产品验收", "交付", "合并预演"], [FIX_LOOP]: ["门禁", "交付"], [GATE_ONLY]: ["门禁"] };
const CHECK_LINE = /^([✔✘-])\s+([\w:-]+)(?::\s*skip)?(?:\s+\((\d+)ms\))?/;

function buildStages(r) {
  const plan = (r.events || []).find((e) => e.type === "plan");   // 带着每一步是谁做的
  const stages = [];
  const rounds = {};
  let open = null;
  const pre = { key: "pre", label: "准备", logs: [], status: "done" };
  for (const ev of r.events || []) {
    if (ev.type === "node_start" && !CONTAINERS.has(ev.node)) {
      const label = STEP_LABEL[ev.node] || ev.node;
      rounds[label] = (rounds[label] || 0) + 1;
      open = { key: label + "#" + rounds[label], node: ev.node, label, round: rounds[label], start: ev.t, end: null, logs: [], status: "running" };
      stages.push(open);
    } else if (ev.type === "node_end" && !CONTAINERS.has(ev.node)) {
      const s = [...stages].reverse().find((x) => x.node === ev.node && x.end === null);
      if (s) { s.end = ev.t; s.status = ev.error ? "fail" : "done"; if (ev.error) s.logs.push({ t: ev.t, text: "✘ " + ev.error }); }
      if (s === open) open = null;
    } else if (ev.type === "log") {
      (open || stages.findLast?.((x) => x.end === null) || pre).logs.push(ev);
    } else if (ev.type === "end" && open) {
      open.end = ev.t; open.status = "fail"; open = null;
    }
  }
  for (const s of stages) {
    if (s.label === "门禁") {
      s.checks = [];
      for (const l of s.logs) {
        const m = CHECK_LINE.exec(l.text.trim());
        if (m) s.checks.push({ name: m[2], state: m[1] === "✔" ? "pass" : m[1] === "✘" ? "fail" : "skip", ms: m[3] });
      }
      if (s.logs.some((l) => /VERIFY FAIL|退出码 [12]/.test(l.text)) && s.status === "done") s.status = "fail";
    }
    if (s.label === "熔断" && s.status === "done") s.status = "fail";
    // 节点本身没抛错，但 agent 没干成：修复出错标红，审阅不可用（不影响后续，修复 agent 直接按失败项改）标黄
    if (s.label === "修复" && s.status === "done" && s.logs.some((l) => /stop_reason=(?!end_turn)/.test(l.text))) s.status = "fail";
    if (s.label === "审阅" && s.status === "done" && s.logs.some((l) => /结论 (unavailable|violation)/.test(l.text) && !/经 skip/.test(l.text))) s.status = "warn";
    s.agent = stageAgent(s, r.input || {}, plan?.agents);
  }
  if (pre.logs.length) stages.unshift(pre);
  return stages;
}
function stageAgent(s, input, agents) {
  if (agents && s.node in agents) return agents[s.node]; // 服务端按本次运行的配置算好的
  if (s.label === "Spec") return "Claude Code";
  if (s.label === "写代码") return agentLabel(input.coding_agent || AGENTS.default);
  if (s.label === "修复") return agentLabel(input.fix_agent || AGENTS.fix_default) || "fix 段配置";
  if (s.label === "审阅") return reviewerLabel(input.review_backend || AGENTS.review_default);
  return "";
}

function renderDetail() {
  const box = $("detail");
  if (!box) return;
  if (!run) {
    box.innerHTML = `<div class="blank"><div class="card"><p>${RUNS.length ? "选一条运行记录查看流程和日志。" : "运行后，这里会显示每一步的进度、门禁结果和日志。"}</p></div></div>`;
    return;
  }
  const r = run;
  const stages = buildStages(r);
  const res = r.result || {};
  const sk = statusKey(r);
  const [stText, , stTag] = RSTATUS[sk] || RSTATUS.done;
  const scroll = box.scrollTop, atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
  const justFinished = box.dataset.run === r.id && box.dataset.status === "running" && r.status !== "running";
  box.dataset.run = r.id; box.dataset.status = r.status;

  // 流程进度条
  const real = stages.filter((s) => s.key !== "pre");
  let flow = "";
  real.forEach((s, i) => {
    if (i) flow += `<span class="arrow ${s.label === "门禁" && s.round > 1 ? "loop" : ""}">${icon(s.label === "门禁" && s.round > 1 ? "loop" : "arrow")}</span>`;
    flow += stepHtml(s);
  });
  if (r.status === "running") {
    const seen = new Set(real.map((s) => s.label));
    const plan = (r.events || []).find((e) => e.type === "plan");
    // [显示名, 将由谁做]；老记录没有计划事件时按模板，不显示 agent
    const planned = plan?.nodes?.map((n) => [STEP_LABEL[n] || n, plan.agents?.[n] || ""]) || (TEMPLATE[r.graph] || []).map((l) => [l, ""]);
    const ghosts = planned.filter(([l]) => !seen.has(l) && !(l === "设计稿" && seen.has("Spec")));
    for (const [l, who] of ghosts) flow += (flow ? `<span class="arrow">${icon("arrow")}</span>` : "") + `<div class="step ghost"><div class="n">${esc(l)}</div><div class="s">${esc([who, "等待"].filter(Boolean).join(" · "))}</div></div>`;
  }

  // 最近一次门禁的检查项
  const gates = real.filter((s) => s.label === "门禁");
  const lastGate = gates[gates.length - 1];
  const checks = lastGate ? `<div class="checks"><span class="lbl">门禁${gates.length > 1 ? " #" + lastGate.round : ""}</span>${
    lastGate.checks.length ? lastGate.checks.map((c) => `<span class="chk ${c.state}" title="${c.ms ? dur(c.ms / 1000) : c.state}">${c.state === "pass" ? "✔" : c.state === "fail" ? "✘" : "–"} ${esc(c.name)}</span>`).join("")
      : `<span class="chk">${lastGate.status === "running" ? "检查中…" : "无检查项输出"}</span>`}
    ${r.graph !== GATE_ONLY && gates.length ? `<span class="rounds">已修复 ${Math.max(0, gates.length - 1)} 轮</span>` : ""}</div>` : "";

  // 结果
  let result = "";
  if (r.status !== "running") {
    const cls = ["delivered", "passed"].includes(sk) ? "ok" : ["broken", "failed", "config_error", "error"].includes(sk) ? "bad" : "";
    const files = res.changed_files || [];
    result = `<div class="result ${cls}"><div class="sum">${esc(res.summary || r.error || r.summary || stText)}</div>
      ${res.break_reason ? `<div style="margin-top:4px;color:var(--muted);font-family:var(--mono);font-size:12px">${esc(res.break_reason)}</div>` : ""}
      ${files.length ? `<details><summary>改动的文件（${files.length}）</summary><ul>${files.map((f) => `<li>${esc(f)}</li>`).join("")}</ul></details>` : ""}</div>`;
  }
  const fails = res.failures || [];
  const failTable = fails.length && r.status !== "running" ? `<div class="fails"><table><thead><tr><th>失败码</th><th>检查</th><th>说明</th><th>位置</th></tr></thead><tbody>${
    fails.map((f) => `<tr><td class="code">${esc(f.code)}</td><td>${esc(f.check)}</td><td>${esc(f.message)}</td><td class="loc">${esc((f.locations || []).slice(0, 3).join("\n"))}</td></tr>`).join("")}</tbody></table></div>` : "";

  // 日志
  const tabs = [["all", "全部"], ...stages.map((s) => [s.key, s.label + (stages.filter((x) => x.label === s.label).length > 1 ? " #" + s.round : "")])];
  const shown = runFilter === "all" ? stages : stages.filter((s) => s.key === runFilter);
  const logs = shown.map((s) => {
    const isOpen = runFilter !== "all" || openGroups.has(s.key) || ["running", "fail", "warn"].includes(s.status) || (r.status !== "running" && s === stages[stages.length - 1]);
    const d = s.end != null ? dur(s.end - s.start) : s.start != null ? "进行中" : "";
    const lines = s.logs.map((l) => `<span class="t">${String((l.t ?? 0).toFixed(1)).padStart(6)}s </span>${colorLine(l.text)}`).join("\n");
    return `<details class="grp ${s.status === "fail" ? "bad" : s.status === "warn" ? "warn" : s.status === "running" ? "running" : s.key === "pre" ? "" : "ok"}" data-key="${esc(s.key)}" ${isOpen ? "open" : ""}>
      <summary>${icon("chev", "chev")}<b>${esc(s.label)}${s.round > 1 ? " #" + s.round : ""}</b><span class="m">${esc([s.agent, d].filter(Boolean).join(" · "))}</span></summary>
      ${s.logs.length ? `<pre>${lines}</pre>` : `<div class="none">${s.status === "running" ? "等待输出…" : "没有日志输出"}</div>`}</details>`;
  }).join("");

  box.innerHTML = `
    <div class="detail-head"><h3 title="${esc(runTitle(r))}">${esc(runTitle(r))}</h3><span class="tag ${stTag}">${r.status === "running" ? '<span class="spin"></span>' : ""}${esc(stText)}</span></div>
    <div class="detail-sub" id="d-sub"></div>
    <div class="flow" id="flow">${flow || '<div class="step ghost"><div class="n">准备中</div></div>'}</div>
    ${checks}${result}${flowCard(r)}<div id="preview-slot"></div>${failTable}
    <div class="log-bar">${tabs.map(([k, l]) => `<button class="tab" type="button" data-f="${esc(k)}" aria-pressed="${k === runFilter}">${esc(l)}</button>`).join("")}
      <span class="grow"></span>${r.status === "running" ? `<button class="btn ghost" id="follow" type="button" aria-pressed="${follow}">${follow ? "跟随最新：开" : "跟随最新：关"}</button>` : ""}</div>
    <div class="log" id="log">${logs || '<div class="none" style="color:var(--faint);font-family:var(--sans)">还没有日志。</div>'}</div>`;
  renderDuration();

  box.querySelectorAll(".log-bar .tab").forEach((b) => b.onclick = () => { runFilter = b.dataset.f; renderDetail(); });
  $("flow").onclick = (e) => { const s = e.target.closest(".step[data-key]"); if (s) { runFilter = s.dataset.key; renderDetail(); } };
  $("follow")?.addEventListener("click", () => { follow = !follow; renderDetail(); });
  $("d-merge")?.addEventListener("click", () => openMerge(r.id));
  renderPreviewSlot();
  box.querySelectorAll("details.grp").forEach((d) => d.ontoggle = () => { d.open ? openGroups.add(d.dataset.key) : openGroups.delete(d.dataset.key); });
  if (r.status === "running" && follow) box.scrollTop = box.scrollHeight;
  else box.scrollTop = justFinished ? 0 : scroll;   // 刚结束：回到顶部看结论
}
// ---------- 预览：结束后把项目跑起来 ----------
let PREVIEW = null, previewTimer = null;
const PV_STATUS = { preparing: ["准备中", "accent"], installing: ["安装依赖", "accent"], starting: ["启动中", "accent"], running: ["运行中", "ok"], exited: ["已退出", ""], failed: ["启动失败", "bad"], stopped: ["已停止", ""] };
const pvActive = (p) => Boolean(p) && ["preparing", "installing", "starting", "running"].includes(p.status);
async function loadPreview() {
  clearTimeout(previewTimer);
  const project = current;
  if (!project) return;
  try { PREVIEW = (await api("/api/preview?project=" + encodeURIComponent(project))).preview; } catch { return; }
  if (project !== current) return;
  renderPreviewSlot();
  if (pvActive(PREVIEW)) previewTimer = setTimeout(loadPreview, PREVIEW.status === "running" ? 3000 : 1500);
}
async function previewAction(action) {
  try {
    PREVIEW = (await post(`/api/preview/${action}`, { project: current, run: run?.id })).preview;
  } catch (err) { toast(err.message, true); }
  renderPreviewSlot();
  loadPreview();
}
function renderPreviewSlot() {
  const slot = $("preview-slot");
  if (!slot || !run) return;
  const p = PREVIEW;
  const delivered = run.status !== "running" && run.graph === PIPELINE && statusKey(run) === "delivered";
  const mine = p && p.runId === run.id;
  let html = "";
  if (p && pvActive(p) && !mine) {
    html = `<div class="pvcard"><div class="row"><span class="tag ${PV_STATUS[p.status][1]}">${PV_STATUS[p.status][0]}</span>
      <span class="grow">正在预览这个项目的另一次运行${p.url ? `：<a class="url" href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.url)}</a>` : ""}</span>
      <button class="btn" type="button" data-pv="stop">停止</button></div></div>`;
  } else if (mine) {
    const [text, tag] = PV_STATUS[p.status] || [p.status, ""];
    html = `<div class="pvcard"><div class="row"><span class="tag ${tag}">${pvActive(p) && p.status !== "running" ? '<span class="spin"></span>' : ""}${esc(text)}</span>
        <span class="grow">${esc(p.source)}${p.command ? ` · <span class="cmd">${esc(p.command)}</span>${p.via ? `（${esc(p.via)}）` : ""}` : ""}</span>
        ${p.url && p.status === "running" ? `<a class="btn primary" href="${esc(p.url)}" target="_blank" rel="noopener">${icon("arrow")}打开 ${esc(p.url)}</a>` : ""}
        ${pvActive(p) ? `<button class="btn" type="button" data-pv="stop">停止</button>` : `<button class="btn" type="button" data-pv="start">${icon("play")}重新预览</button>`}</div>
      ${p.error ? `<div class="err">${esc(p.error)}</div>` : ""}
      ${p.log.length ? `<details ${pvActive(p) && p.status !== "running" ? "open" : ""}><summary>预览日志（${p.log.length} 行）</summary><pre>${esc(p.log.slice(-40).join("\n"))}</pre></details>` : ""}</div>`;
  } else if (delivered) {
    html = `<div class="pvcard"><div class="row"><span class="grow">把这次交付的代码跑起来看看效果（待合并的在临时目录里跑作业分支，不动项目本身）。</span>
      <button class="btn primary" type="button" data-pv="start">${icon("play")}预览</button></div></div>`;
  }
  slot.innerHTML = html;
  slot.onclick = (e) => { const b = e.target.closest("[data-pv]"); if (b) previewAction(b.dataset.pv); };
}

function flowCard(r) {
  const f = r.flow;
  if (!f || r.status === "running") return "";
  const [text, tag] = FLOW_STATUS[f.status] || [f.status, ""];
  const reh = f.rehearsal ? `合并预演（${esc(f.rehearsal.target)}）${f.rehearsal.passed ? "通过" : "未通过"}` : "";
  return `<div class="flowcard"><span class="tag ${tag}">${esc(text)}</span>
    <span class="grow"><span class="b">${esc(f.branch)}</span> ← ${esc(f.base)}${f.merged_into ? ` · 已合并到 ${esc(f.merged_into)}` : reh ? " · " + reh : ""}
      ${f.note ? `<div class="note">${esc(f.note)}</div>` : ""}</span>
    ${isPending(f) ? `<button class="btn primary" type="button" id="d-merge">处理合并…</button>` : ""}</div>`;
}
function stepHtml(s) {
  const d = s.end != null ? dur(s.end - s.start) : "";
  let sub = [s.agent, d].filter(Boolean).join(" · ");
  if (s.label === "门禁" && s.status === "fail") {
    const bad = (s.checks || []).filter((c) => c.state === "fail").map((c) => c.name);
    sub = (bad.length ? "✘ " + bad.join(", ") : "未通过") + (d ? " · " + d : "");
  }
  if (s.status === "running") sub = [s.agent, "进行中"].filter(Boolean).join(" · ");
  return `<div class="step ${s.status} ${runFilter === s.key ? "sel" : ""}" data-key="${esc(s.key)}" title="点击只看这一步的日志">
    <div class="n">${s.status === "running" ? '<span class="spin"></span>' : ""}${esc(s.label)}${s.round > 1 ? " #" + s.round : ""}</div><div class="s">${esc(sub || " ")}</div></div>`;
}
function colorLine(text) {
  const t = esc(text);
  if (/^✘|VERIFY FAIL|^\[熔断\]|Error|错误/.test(text)) return `<span class="x">${t}</span>`;
  if (/^✔|VERIFY PASS|^\[交付\]/.test(text)) return `<span class="v">${t}</span>`;
  if (/^\[[^\]]+\]/.test(text)) return `<span class="h">${t}</span>`;
  return t;
}
function renderDuration() {
  const el = $("d-sub");
  if (!el || !run) return;
  const end = run.finished || Date.now() / 1000;
  const parts = [`开始于 ${new Date(run.started * 1000).toLocaleString("zh-CN", { hour12: false })}`, `用时 ${dur(end - run.started)}`];
  const inp = run.input || {};
  if (inp.coding_agent) parts.push("编程 " + agentLabel(inp.coding_agent));
  if (inp.fix_agent) parts.push("修复 " + agentLabel(inp.fix_agent));
  if (inp.review_backend) parts.push("审阅 " + reviewerLabel(inp.review_backend));
  el.textContent = parts.join(" · ");
}

// ---------- 启动 ----------
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closePop(); });
$("merge-dlg").addEventListener("close", () => { clearTimeout(MERGE?.timer); MERGE = null; });
applyTheme();
(async () => {
  try {
    AGENTS = await api("/api/agents");
    await loadWs();
    setConn(true, "本地服务已连接");
  } catch (err) {
    setConn(false, err.message);
    $("main").innerHTML = `<div class="blank"><div class="card"><h2>连不上本地服务</h2><p>${esc(err.message)}</p></div></div>`;
    return;
  }
  if (!wsOf(current)) current = WS[0]?.path || null;
  selectWs(current);
  // 侧栏状态（其他窗口发起的运行、终端里跑的运行）定期刷新
  setInterval(async () => { try { await loadWs(); setConn(true, "本地服务已连接"); } catch { setConn(false, "本地服务已断开"); } }, 5000);
})();
</script>
