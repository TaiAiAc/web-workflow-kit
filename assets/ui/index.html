<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>前端交付流水线</title>
<style>
:root {
  --bg: #f5f6f8; --side: #eceef2; --panel: #ffffff; --panel-2: #f3f4f7; --hover: rgba(20, 30, 50, .06); --sel: rgba(47, 111, 237, .12);
  --line: #e1e4ea; --line-2: #cdd2da; --text: #1c2330; --muted: #5d6676; --faint: #8a93a3;
  --accent: #2f6fed; --accent-soft: #e8efff; --on-accent: #fff;
  --ok: #1a8a4f; --ok-soft: #e4f5ec; --bad: #cc3340; --bad-soft: #fdebed; --warn: #b76e00; --warn-soft: #fff3df;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  --r: 7px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15181e; --side: #1b1f27; --panel: #1d222b; --panel-2: #232934; --hover: rgba(255, 255, 255, .06); --sel: rgba(109, 155, 255, .18);
    --line: #2a303c; --line-2: #3a4252; --text: #e6e9ef; --muted: #a0a9b8; --faint: #747e8f;
    --accent: #6d9bff; --accent-soft: #1d2a45; --on-accent: #0b1220;
    --ok: #4cc38a; --ok-soft: #14291f; --bad: #ff6b76; --bad-soft: #33181c; --warn: #f0a947; --warn-soft: #2e2311;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15181e; --side: #1b1f27; --panel: #1d222b; --panel-2: #232934; --hover: rgba(255, 255, 255, .06); --sel: rgba(109, 155, 255, .18);
  --line: #2a303c; --line-2: #3a4252; --text: #e6e9ef; --muted: #a0a9b8; --faint: #747e8f;
  --accent: #6d9bff; --accent-soft: #1d2a45; --on-accent: #0b1220;
  --ok: #4cc38a; --ok-soft: #14291f; --bad: #ff6b76; --bad-soft: #33181c; --warn: #f0a947; --warn-soft: #2e2311;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 13px/1.5 var(--sans); overflow: hidden; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; }
.hidden { display: none !important; }
svg.i { width: 15px; height: 15px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- 外框 ---------- */
.app { display: grid; grid-template-columns: 248px minmax(0, 1fr); height: 100vh; }
.side { background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.side-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 12px 8px 16px; }
.side-head h1 { font-size: 12px; font-weight: 600; color: var(--muted); margin: 0; letter-spacing: .02em; }
.ws-list { list-style: none; margin: 0; padding: 0 8px; overflow-y: auto; flex: 1; }
.ws { position: relative; display: flex; gap: 9px; align-items: flex-start; padding: 8px 8px 8px 10px; border-radius: var(--r); cursor: pointer; }
.ws:hover { background: var(--hover); }
.ws[aria-current="true"] { background: var(--sel); }
.ws .dot { margin-top: 6px; }
.ws .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ws .sub { color: var(--faint); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ws .grow { min-width: 0; flex: 1; }
.ws .more { visibility: hidden; }
.ws:hover .more, .ws[aria-current="true"] .more { visibility: visible; }
.side-foot { border-top: 1px solid var(--line); padding: 8px; display: flex; flex-direction: column; gap: 2px; }
.side-foot .row { display: flex; align-items: center; gap: 8px; padding: 6px 8px; color: var(--muted); border-radius: var(--r); background: none; border: 0; text-align: left; width: 100%; }
.side-foot button.row:hover { background: var(--hover); color: var(--text); }

.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line-2); flex: none; }
.dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); } .dot.warn { background: var(--warn); }
.dot.running { background: var(--accent); animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }

.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }

/* ---------- 按钮 ---------- */
.btn { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: var(--r); border: 1px solid var(--line-2); background: var(--panel); white-space: nowrap; }
.btn:hover { background: var(--panel-2); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { border-color: transparent; background: none; color: var(--muted); }
.btn.ghost:hover { background: var(--hover); color: var(--text); }
.btn.icon { width: 28px; padding: 0; justify-content: center; }
.btn.warn { border-color: var(--warn); color: var(--warn); }
kbd { font: 11px var(--mono); color: inherit; opacity: .75; }

/* ---------- 工具栏 ---------- */
.toolbar { display: flex; align-items: center; gap: 10px; padding: 12px 18px; border-bottom: 1px solid var(--line); background: var(--panel); min-height: 58px; }
.toolbar .title { min-width: 0; flex: 1; }
.toolbar h2 { font-size: 15px; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.toolbar .meta { display: flex; gap: 8px; align-items: center; color: var(--faint); font-size: 12px; min-width: 0; }
.toolbar .path { font-family: var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tag { display: inline-flex; align-items: center; gap: 4px; padding: 0 7px; height: 20px; border-radius: 10px; background: var(--panel-2); color: var(--muted); font-size: 11.5px; white-space: nowrap; }
.tag.ok { background: var(--ok-soft); color: var(--ok); } .tag.bad { background: var(--bad-soft); color: var(--bad); }
.tag.warn { background: var(--warn-soft); color: var(--warn); } .tag.accent { background: var(--accent-soft); color: var(--accent); }
.tools { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }

.banner { display: flex; align-items: center; gap: 10px; margin: 12px 18px 0; padding: 8px 12px; border-radius: var(--r); background: var(--warn-soft); color: var(--warn); }
.banner .grow { flex: 1; }

/* ---------- 需求区 ---------- */
.compose { margin: 14px 18px 0; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
.compose textarea { display: block; width: 100%; min-height: 64px; max-height: 180px; resize: vertical; border: 0; background: none; color: var(--text); font: 14px/1.6 var(--sans); padding: 12px 14px 6px; outline: none; }
.recent { display: flex; gap: 6px; padding: 0 14px 8px; flex-wrap: wrap; }
.recent button { border: 1px dashed var(--line-2); background: none; color: var(--muted); border-radius: 12px; padding: 1px 9px; font-size: 12px; max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.recent button:hover { color: var(--text); border-color: var(--muted); }
.choices { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--line); }
.choice { display: flex; align-items: center; gap: 8px; }
.choice > span { color: var(--faint); font-size: 12px; }
.seg { display: inline-flex; background: var(--panel-2); border-radius: var(--r); padding: 2px; gap: 2px; }
.seg button { border: 0; background: none; color: var(--muted); padding: 3px 9px; border-radius: 5px; font-size: 12px; white-space: nowrap; }
.seg button:hover { color: var(--text); }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--text); font-weight: 600; box-shadow: 0 0 0 1px var(--line-2); }
.seg button.na { text-decoration: line-through; text-decoration-color: var(--faint); opacity: .6; }
.compose-foot { display: flex; align-items: center; gap: 8px; padding: 8px 10px 10px 14px; }
.compose-foot .grow { flex: 1; color: var(--bad); font-size: 12px; }
.design-chip { display: inline-flex; align-items: center; gap: 6px; max-width: 260px; }
.design-chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- 运行区 ---------- */
.work { flex: 1; min-height: 0; display: grid; grid-template-columns: 236px minmax(0, 1fr); margin: 14px 18px 18px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.runs { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.runs h3, .pane-title { font-size: 12px; color: var(--faint); font-weight: 600; margin: 0; padding: 10px 12px 6px; }
.runs ul { list-style: none; margin: 0; padding: 0 6px 6px; overflow-y: auto; flex: 1; }
.run-item { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 7px 8px; border-radius: var(--r); }
.run-item:hover { background: var(--hover); }
.run-item[aria-current="true"] { background: var(--sel); }
.run-item .l1 { display: flex; align-items: center; gap: 7px; }
.run-item .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
.run-item .l2 { color: var(--faint); font-size: 11.5px; margin-left: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.runs .empty { color: var(--faint); padding: 10px 12px; }

.detail { display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow-y: auto; }
.detail > * { flex-shrink: 0; }   /* 整栏滚动，子块不被压扁 */
.detail-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px 4px; flex-wrap: wrap; }
.detail-head h3 { margin: 0; font-size: 14px; min-width: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.detail-sub { color: var(--faint); font-size: 12px; padding: 0 16px; }

/* 流程进度条 */
.flow { display: flex; align-items: stretch; gap: 0; padding: 14px 16px 6px; overflow-x: auto; }
.step { flex: none; min-width: 104px; max-width: 168px; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 7px 10px; cursor: pointer; }
.step:hover { border-color: var(--line-2); }
.step .n { display: flex; align-items: center; gap: 6px; font-weight: 600; white-space: nowrap; }
.step .s { color: var(--faint); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.step.done { border-color: color-mix(in srgb, var(--ok) 45%, var(--line)); background: var(--ok-soft); }
.step.done .n { color: var(--ok); }
.step.fail { border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); background: var(--bad-soft); }
.step.fail .n { color: var(--bad); }
.step.running { border-color: var(--accent); background: var(--accent-soft); }
.step.running .n { color: var(--accent); }
.step.warn { border-color: color-mix(in srgb, var(--warn) 45%, var(--line)); background: var(--warn-soft); }
.step.warn .n { color: var(--warn); }
.step.ghost { border-style: dashed; background: none; color: var(--faint); cursor: default; }
.step.ghost .n { color: var(--faint); font-weight: 500; }
.step.sel { box-shadow: 0 0 0 2px var(--accent); }
.arrow { flex: none; display: flex; align-items: center; color: var(--line-2); padding: 0 4px; }
.arrow.loop { color: var(--warn); }
.spin { width: 12px; height: 12px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: rot .8s linear infinite; flex: none; }
@keyframes rot { to { transform: rotate(360deg); } }

.checks { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding: 4px 16px 10px; font-size: 12px; }
.checks .lbl { color: var(--faint); }
.chk { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 10px; background: var(--panel-2); color: var(--muted); font-family: var(--mono); font-size: 11.5px; }
.chk.pass { background: var(--ok-soft); color: var(--ok); } .chk.fail { background: var(--bad-soft); color: var(--bad); }
.chk.skip { color: var(--faint); }
.checks .rounds { margin-left: auto; color: var(--faint); }

.result { margin: 4px 16px 10px; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2); }
.result.ok { background: var(--ok-soft); border-color: color-mix(in srgb, var(--ok) 35%, var(--line)); }
.result.bad { background: var(--bad-soft); border-color: color-mix(in srgb, var(--bad) 35%, var(--line)); }
.result .sum { font-weight: 600; }
.result details { margin-top: 6px; color: var(--muted); }
.result summary { cursor: pointer; }
.result ul { margin: 6px 0 0; padding-left: 18px; font-family: var(--mono); font-size: 12px; max-height: 180px; overflow-y: auto; }
.fails { margin: 0 16px 10px; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.fails table { width: 100%; border-collapse: collapse; font-size: 12px; }
.fails th, .fails td { text-align: left; padding: 6px 10px; border-top: 1px solid var(--line); vertical-align: top; }
.fails th { background: var(--panel-2); color: var(--faint); font-weight: 600; border-top: 0; }
.fails td.code { font-family: var(--mono); color: var(--bad); white-space: nowrap; }
.fails td.loc { font-family: var(--mono); color: var(--muted); }

/* 日志 */
.log-bar { display: flex; align-items: center; gap: 4px; padding: 6px 16px; border-top: 1px solid var(--line); flex-wrap: wrap; position: sticky; top: 0; background: var(--panel); z-index: 1; }
.log-bar .tab { border: 0; background: none; color: var(--muted); padding: 3px 9px; border-radius: 12px; font-size: 12px; }
.log-bar .tab:hover { background: var(--hover); }
.log-bar .tab[aria-pressed="true"] { background: var(--panel-2); color: var(--text); font-weight: 600; }
.log-bar .grow { flex: 1; }
.log { padding: 4px 16px 16px; font: 12px/1.65 var(--mono); }
.grp { border-left: 2px solid var(--line); margin: 6px 0; }
.grp.ok { border-left-color: var(--ok); } .grp.bad { border-left-color: var(--bad); } .grp.warn { border-left-color: var(--warn); } .grp.running { border-left-color: var(--accent); }
.grp > summary { list-style: none; cursor: pointer; padding: 3px 10px; font-family: var(--sans); font-size: 12.5px; display: flex; gap: 8px; align-items: center; }
.grp > summary::-webkit-details-marker { display: none; }
.grp > summary .chev { transition: transform .15s; color: var(--faint); }
.grp[open] > summary .chev { transform: rotate(90deg); }
.grp > summary b { font-weight: 600; }
.grp > summary .m { color: var(--faint); }
.grp pre { margin: 0; padding: 2px 10px 6px 26px; white-space: pre-wrap; word-break: break-word; color: var(--muted); }
.grp pre .t { color: var(--faint); user-select: none; }
.grp pre .x { color: var(--bad); } .grp pre .v { color: var(--ok); } .grp pre .h { color: var(--text); }
.grp .none { padding: 2px 10px 6px 26px; color: var(--faint); font-family: var(--sans); }

/* 空状态 / 弹层 / 提示 */
.blank { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px; }
.blank .card { max-width: 420px; text-align: center; }
.blank h2 { font-size: 18px; margin: 0 0 6px; }
.blank p { color: var(--muted); margin: 0 0 16px; }
.detail .blank { min-height: 220px; }
.pop { position: fixed; z-index: 20; background: var(--panel); border: 1px solid var(--line-2); border-radius: 9px; box-shadow: 0 10px 30px rgba(0, 0, 0, .18); padding: 6px; min-width: 200px; }
.pop button { display: flex; width: 100%; align-items: center; gap: 8px; border: 0; background: none; padding: 7px 10px; border-radius: 6px; text-align: left; }
.pop button:hover { background: var(--hover); }
.pop button.danger { color: var(--bad); }
.pop .sep { height: 1px; background: var(--line); margin: 4px 2px; }
.pop .agent-row { display: flex; gap: 8px; align-items: flex-start; padding: 6px 10px; }
.pop .agent-row .d { color: var(--faint); font-size: 12px; }
.toasts { position: fixed; right: 18px; bottom: 18px; display: flex; flex-direction: column; gap: 8px; z-index: 30; }
.toast { background: var(--text); color: var(--bg); padding: 9px 14px; border-radius: 8px; max-width: 420px; box-shadow: 0 6px 20px rgba(0, 0, 0, .2); }
.toast.bad { background: var(--bad); color: #fff; }
</style>
</head>
<body>
<div class="app">
  <nav class="side" aria-label="工作空间">
    <div class="side-head">
      <h1>工作空间</h1>
      <button class="btn icon ghost" id="add-ws" type="button" title="添加项目" aria-label="添加项目"></button>
    </div>
    <ul class="ws-list" id="ws-list"></ul>
    <div class="side-foot">
      <button class="row" id="agents-btn" type="button"></button>
      <button class="row" id="theme-btn" type="button"></button>
      <div class="row"><span class="dot" id="conn-dot"></span><span id="conn-text">连接中…</span></div>
    </div>
  </nav>
  <main class="main" id="main"></main>
</div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<script>
"use strict";
const TOKEN = "__WWK_TOKEN__";
const PIPELINE = "前端交付流水线", FIX_LOOP = "门禁修复回环", GATE_ONLY = "仅门禁";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const desktop = window.wwkDesktop || null;

async function api(path, opts = {}) {
  const res = await fetch(path, { ...opts, headers: { "X-WWK-Token": TOKEN, "Content-Type": "application/json", ...(opts.headers || {}) } });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `请求失败（${res.status}）`);
  return data;
}
const post = (path, body) => api(path, { method: "POST", body: JSON.stringify(body) });

// ---------- 图标（页面不加载外部资源，内联 SVG） ----------
const ICONS = {
  plus: '<path d="M12 5v14M5 12h14"/>',
  play: '<path d="M7 5l12 7-12 7z"/>',
  shield: '<path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/><path d="M9 12l2 2 4-4"/>',
  loop: '<path d="M4 12a8 8 0 0 1 14-5.3L20 9"/><path d="M20 4v5h-5"/><path d="M20 12a8 8 0 0 1-14 5.3L4 15"/><path d="M4 20v-5h5"/>',
  folder: '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  more: '<circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/>',
  clip: '<path d="M21 11l-8.5 8.5a5 5 0 0 1-7-7L14 4a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3L15 7"/>',
  x: '<path d="M6 6l12 12M18 6L6 18"/>',
  chev: '<path d="M9 6l6 6-6 6"/>',
  arrow: '<path d="M5 12h14M13 6l6 6-6 6"/>',
  cpu: '<rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  wand: '<path d="M15 4V2M15 10V8M11 6h2M17 6h2M4 20L14 10"/>',
  trash: '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
};
const icon = (n, cls = "") => `<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]}</svg>`;

// ---------- 小工具 ----------
function toast(text, bad = false) {
  const el = document.createElement("div");
  el.className = "toast" + (bad ? " bad" : "");
  el.textContent = text;
  $("toasts").appendChild(el);
  setTimeout(() => el.remove(), bad ? 6000 : 3000);
}
function ago(sec) {
  if (!sec) return "";
  const d = Date.now() / 1000 - sec;
  if (d < 60) return "刚刚";
  if (d < 3600) return `${Math.floor(d / 60)} 分钟前`;
  if (d < 86400) return `${Math.floor(d / 3600)} 小时前`;
  if (d < 86400 * 2) return "昨天";
  return new Date(sec * 1000).toLocaleDateString("zh-CN", { month: "numeric", day: "numeric" });
}
function dur(s) {
  if (s == null || s < 0) return "";
  if (s < 1) return "<1s";
  if (s < 60) return `${Math.round(s)}s`;
  const m = Math.floor(s / 60), r = Math.round(s % 60);
  return m < 60 ? `${m}m${String(r).padStart(2, "0")}s` : `${Math.floor(m / 60)}h${String(m % 60).padStart(2, "0")}m`;
}
let popEl = null;
function closePop() { popEl?.remove(); popEl = null; }
function openPop(anchor, html, onClick) {
  closePop();
  popEl = document.createElement("div");
  popEl.className = "pop";
  popEl.innerHTML = html;
  document.body.appendChild(popEl);
  const r = anchor.getBoundingClientRect();
  const w = popEl.offsetWidth, h = popEl.offsetHeight;
  popEl.style.left = Math.max(8, Math.min(r.left, innerWidth - w - 8)) + "px";
  popEl.style.top = (r.bottom + h + 6 > innerHeight ? Math.max(8, r.top - h - 6) : r.bottom + 6) + "px";
  popEl.onclick = (e) => { const b = e.target.closest("button[data-act]"); if (b) { closePop(); onClick(b.dataset.act, b); } };
  setTimeout(() => document.addEventListener("click", outside, { once: true }), 0);
  function outside(e) { if (popEl && !popEl.contains(e.target)) closePop(); else if (popEl) document.addEventListener("click", outside, { once: true }); }
}

// ---------- 阶段：由事件推出流程进度与分组日志 ----------
const CONTAINERS = new Set(["编码", "审阅修复"]);
const STEP_LABEL = { "读取设计稿": "设计稿", "生成Spec": "Spec", "写代码": "写代码", "门禁": "门禁", "验收审阅": "审阅", "执行修复": "修复", "交付": "交付", "熔断": "熔断" };
const TEMPLATE = { [PIPELINE]: ["设计稿", "Spec", "写代码", "门禁", "交付"], [FIX_LOOP]: ["门禁", "交付"], [GATE_ONLY]: ["门禁"] };
const CHECK_LINE = /^([✔✘-])\s+([\w:-]+)(?::\s*skip)?(?:\s+\((\d+)ms\))?/;

function buildStages(r) {
  const stages = [];
  const rounds = {};
  let open = null;
  const pre = { key: "pre", label: "准备", logs: [], status: "done" };
  for (const ev of r.events || []) {
    if (ev.type === "node_start" && !CONTAINERS.has(ev.node)) {
      const label = STEP_LABEL[ev.node] || ev.node;
      rounds[label] = (rounds[label] || 0) + 1;
      open = { key: label + "#" + rounds[label], node: ev.node, label, round: rounds[label], start: ev.t, end: null, logs: [], status: "running" };
      stages.push(open);
    } else if (ev.type === "node_end" && !CONTAINERS.has(ev.node)) {
      const s = [...stages].reverse().find((x) => x.node === ev.node && x.end === null);
      if (s) { s.end = ev.t; s.status = ev.error ? "fail" : "done"; if (ev.error) s.logs.push({ t: ev.t, text: "✘ " + ev.error }); }
      if (s === open) open = null;
    } else if (ev.type === "log") {
      (open || stages.findLast?.((x) => x.end === null) || pre).logs.push(ev);
    } else if (ev.type === "end" && open) {
      open.end = ev.t; open.status = "fail"; open = null;
    }
  }
  for (const s of stages) {
    if (s.label === "门禁") {
      s.checks = [];
      for (const l of s.logs) {
        const m = CHECK_LINE.exec(l.text.trim());
        if (m) s.checks.push({ name: m[2], state: m[1] === "✔" ? "pass" : m[1] === "✘" ? "fail" : "skip", ms: m[3] });
      }
      if (s.logs.some((l) => /VERIFY FAIL|退出码 [12]/.test(l.text)) && s.status === "done") s.status = "fail";
    }
    if (s.label === "熔断" && s.status === "done") s.status = "fail";
    // 节点本身没抛错，但 agent 没干成：修复出错标红，审阅不可用（不影响后续，修复 agent 直接按失败项改）标黄
    if (s.label === "修复" && s.status === "done" && s.logs.some((l) => /stop_reason=(?!end_turn)/.test(l.text))) s.status = "fail";
    if (s.label === "审阅" && s.status === "done" && s.logs.some((l) => /结论 (unavailable|violation)/.test(l.text) && !/经 skip/.test(l.text))) s.status = "warn";
    s.agent = stageAgent(s, r.input || {});
  }
  if (pre.logs.length) stages.unshift(pre);
  return stages;
}
function stageAgent(s, input) {
  if (s.label === "Spec") return "Claude Code";
  if (s.label === "写代码") return agentLabel(input.coding_agent || AGENTS.default);
  if (s.label === "修复") return agentLabel(input.fix_agent || AGENTS.fix_default) || "fix 段配置";
  if (s.label === "审阅") return reviewerLabel(input.review_backend || AGENTS.review_default);
  return "";
}

function renderDetail() {
  const box = $("detail");
  if (!box) return;
  if (!run) {
    box.innerHTML = `<div class="blank"><div class="card"><p>${RUNS.length ? "选一条运行记录查看流程和日志。" : "运行后，这里会显示每一步的进度、门禁结果和日志。"}</p></div></div>`;
    return;
  }
  const r = run;
  const stages = buildStages(r);
  const res = r.result || {};
  const sk = statusKey(r);
  const [stText, , stTag] = RSTATUS[sk] || RSTATUS.done;
  const scroll = box.scrollTop, atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
  const justFinished = box.dataset.run === r.id && box.dataset.status === "running" && r.status !== "running";
  box.dataset.run = r.id; box.dataset.status = r.status;

  // 流程进度条
  const real = stages.filter((s) => s.key !== "pre");
  let flow = "";
  real.forEach((s, i) => {
    if (i) flow += `<span class="arrow ${s.label === "门禁" && s.round > 1 ? "loop" : ""}">${icon(s.label === "门禁" && s.round > 1 ? "loop" : "arrow")}</span>`;
    flow += stepHtml(s);
  });
  if (r.status === "running") {
    const seen = new Set(real.map((s) => s.label));
    const ghosts = (TEMPLATE[r.graph] || []).filter((l) => !seen.has(l) && !(l === "设计稿" && seen.has("Spec")));
    for (const l of ghosts) flow += (flow ? `<span class="arrow">${icon("arrow")}</span>` : "") + `<div class="step ghost"><div class="n">${esc(l)}</div><div class="s">等待</div></div>`;
  }

  // 最近一次门禁的检查项
  const gates = real.filter((s) => s.label === "门禁");
  const lastGate = gates[gates.length - 1];
  const checks = lastGate ? `<div class="checks"><span class="lbl">门禁${gates.length > 1 ? " #" + lastGate.round : ""}</span>${
    lastGate.checks.length ? lastGate.checks.map((c) => `<span class="chk ${c.state}" title="${c.ms ? dur(c.ms / 1000) : c.state}">${c.state === "pass" ? "✔" : c.state === "fail" ? "✘" : "–"} ${esc(c.name)}</span>`).join("")
      : `<span class="chk">${lastGate.status === "running" ? "检查中…" : "无检查项输出"}</span>`}
    ${r.graph !== GATE_ONLY && gates.length ? `<span class="rounds">已修复 ${Math.max(0, gates.length - 1)} 轮</span>` : ""}</div>` : "";

  // 结果
  let result = "";
  if (r.status !== "running") {
    const cls = ["delivered", "passed"].includes(sk) ? "ok" : ["broken", "failed", "config_error", "error"].includes(sk) ? "bad" : "";
    const files = res.changed_files || [];
    result = `<div class="result ${cls}"><div class="sum">${esc(res.summary || r.error || r.summary || stText)}</div>
      ${res.break_reason ? `<div style="margin-top:4px;color:var(--muted);font-family:var(--mono);font-size:12px">${esc(res.break_reason)}</div>` : ""}
      ${files.length ? `<details><summary>改动的文件（${files.length}）</summary><ul>${files.map((f) => `<li>${esc(f)}</li>`).join("")}</ul></details>` : ""}</div>`;
  }
  const fails = res.failures || [];
  const failTable = fails.length && r.status !== "running" ? `<div class="fails"><table><thead><tr><th>失败码</th><th>检查</th><th>说明</th><th>位置</th></tr></thead><tbody>${
    fails.map((f) => `<tr><td class="code">${esc(f.code)}</td><td>${esc(f.check)}</td><td>${esc(f.message)}</td><td class="loc">${esc((f.locations || []).slice(0, 3).join("\n"))}</td></tr>`).join("")}</tbody></table></div>` : "";

  // 日志
  const tabs = [["all", "全部"], ...stages.map((s) => [s.key, s.label + (stages.filter((x) => x.label === s.label).length > 1 ? " #" + s.round : "")])];
  const shown = runFilter === "all" ? stages : stages.filter((s) => s.key === runFilter);
  const logs = shown.map((s) => {
    const isOpen = runFilter !== "all" || openGroups.has(s.key) || ["running", "fail", "warn"].includes(s.status) || (r.status !== "running" && s === stages[stages.length - 1]);
    const d = s.end != null ? dur(s.end - s.start) : s.start != null ? "进行中" : "";
    const lines = s.logs.map((l) => `<span class="t">${String((l.t ?? 0).toFixed(1)).padStart(6)}s </span>${colorLine(l.text)}`).join("\n");
    return `<details class="grp ${s.status === "fail" ? "bad" : s.status === "warn" ? "warn" : s.status === "running" ? "running" : s.key === "pre" ? "" : "ok"}" data-key="${esc(s.key)}" ${isOpen ? "open" : ""}>
      <summary>${icon("chev", "chev")}<b>${esc(s.label)}${s.round > 1 ? " #" + s.round : ""}</b><span class="m">${esc([s.agent, d].filter(Boolean).join(" · "))}</span></summary>
      ${s.logs.length ? `<pre>${lines}</pre>` : `<div class="none">${s.status === "running" ? "等待输出…" : "没有日志输出"}</div>`}</details>`;
  }).join("");

  box.innerHTML = `
    <div class="detail-head"><h3 title="${esc(runTitle(r))}">${esc(runTitle(r))}</h3><span class="tag ${stTag}">${r.status === "running" ? '<span class="spin"></span>' : ""}${esc(stText)}</span></div>
    <div class="detail-sub" id="d-sub"></div>
    <div class="flow" id="flow">${flow || '<div class="step ghost"><div class="n">准备中</div></div>'}</div>
    ${checks}${result}${failTable}
    <div class="log-bar">${tabs.map(([k, l]) => `<button class="tab" type="button" data-f="${esc(k)}" aria-pressed="${k === runFilter}">${esc(l)}</button>`).join("")}
      <span class="grow"></span>${r.status === "running" ? `<button class="btn ghost" id="follow" type="button" aria-pressed="${follow}">${follow ? "跟随最新：开" : "跟随最新：关"}</button>` : ""}</div>
    <div class="log" id="log">${logs || '<div class="none" style="color:var(--faint);font-family:var(--sans)">还没有日志。</div>'}</div>`;
  renderDuration();

  box.querySelectorAll(".log-bar .tab").forEach((b) => b.onclick = () => { runFilter = b.dataset.f; renderDetail(); });
  $("flow").onclick = (e) => { const s = e.target.closest(".step[data-key]"); if (s) { runFilter = s.dataset.key; renderDetail(); } };
  $("follow")?.addEventListener("click", () => { follow = !follow; renderDetail(); });
  box.querySelectorAll("details.grp").forEach((d) => d.ontoggle = () => { d.open ? openGroups.add(d.dataset.key) : openGroups.delete(d.dataset.key); });
  if (r.status === "running" && follow) box.scrollTop = box.scrollHeight;
  else box.scrollTop = justFinished ? 0 : scroll;   // 刚结束：回到顶部看结论
}
function stepHtml(s) {
  const d = s.end != null ? dur(s.end - s.start) : "";
  let sub = [s.agent, d].filter(Boolean).join(" · ");
  if (s.label === "门禁" && s.status === "fail") {
    const bad = (s.checks || []).filter((c) => c.state === "fail").map((c) => c.name);
    sub = (bad.length ? "✘ " + bad.join(", ") : "未通过") + (d ? " · " + d : "");
  }
  if (s.status === "running") sub = [s.agent, "进行中"].filter(Boolean).join(" · ");
  return `<div class="step ${s.status} ${runFilter === s.key ? "sel" : ""}" data-key="${esc(s.key)}" title="点击只看这一步的日志">
    <div class="n">${s.status === "running" ? '<span class="spin"></span>' : ""}${esc(s.label)}${s.round > 1 ? " #" + s.round : ""}</div><div class="s">${esc(sub || " ")}</div></div>`;
}
function colorLine(text) {
  const t = esc(text);
  if (/^✘|VERIFY FAIL|^\[熔断\]|Error|错误/.test(text)) return `<span class="x">${t}</span>`;
  if (/^✔|VERIFY PASS|^\[交付\]/.test(text)) return `<span class="v">${t}</span>`;
  if (/^\[[^\]]+\]/.test(text)) return `<span class="h">${t}</span>`;
  return t;
}
function renderDuration() {
  const el = $("d-sub");
  if (!el || !run) return;
  const end = run.finished || Date.now() / 1000;
  const parts = [`开始于 ${new Date(run.started * 1000).toLocaleString("zh-CN", { hour12: false })}`, `用时 ${dur(end - run.started)}`];
  const inp = run.input || {};
  if (inp.coding_agent) parts.push("编程 " + agentLabel(inp.coding_agent));
  if (inp.fix_agent) parts.push("修复 " + agentLabel(inp.fix_agent));
  if (inp.review_backend) parts.push("审阅 " + reviewerLabel(inp.review_backend));
  el.textContent = parts.join(" · ");
}

// ---------- 启动 ----------
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closePop(); });
applyTheme();
(async () => {
  try {
    AGENTS = await api("/api/agents");
    await loadWs();
    setConn(true, "本地服务已连接");
  } catch (err) {
    setConn(false, err.message);
    $("main").innerHTML = `<div class="blank"><div class="card"><h2>连不上本地服务</h2><p>${esc(err.message)}</p></div></div>`;
    return;
  }
  if (!wsOf(current)) current = WS[0]?.path || null;
  selectWs(current);
  // 侧栏状态（其他窗口发起的运行、终端里跑的运行）定期刷新
  setInterval(async () => { try { await loadWs(); setConn(true, "本地服务已连接"); } catch { setConn(false, "本地服务已断开"); } }, 5000);
})();
</script>
</body>
