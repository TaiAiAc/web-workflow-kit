<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 小尺寸版：线更粗、去掉节点内圆，16px 下也认得出 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b7bff"/>
      <stop offset="1" stop-color="#7046d6"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bg)"/>
  <polyline points="15,34 27,46 50,21" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="15" cy="34" r="6" fill="#ffffff"/>
  <circle cx="27" cy="46" r="6" fill="#ffffff"/>
  <circle cx="50" cy="21" r="6" fill="#ffffff"/>
</svg>
